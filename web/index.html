<!DOCTYPE html>
<html lang="zh-HK" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>🎬 創作室 Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;600;700&family=Noto+Serif+HK:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ---------- Theme tokens ---------- */
        :root {
            --bg: #FFFFFF;
            --bg-subtle: #FAFAF9;
            --text: #18181B;
            --text-muted: #52525B;
            --border: #E4E4E7;
            --border-strong: #71717A;
            --card-bg: #FFFFFF;
            --accent: #1D4ED8;
            --accent-text: #1E40AF;
            --accent-soft: #EFF6FF;
            --accent-border: #93C5FD;
            --chip-bg: #FAFAF9;
            --chip-text: #3F3F46;
            --chip-active-bg: #1D4ED8;
            --chip-active-text: #FFFFFF;
            --badge-bg: #F4F4F5;
            --badge-text: #3F3F46;
            --topbar-bg: #18181B;
            --topbar-text: #FAFAF8;
            --topbar-muted: #D4D4D8;
            --danger: #B91C1C;
            --shadow: 0 1px 2px rgba(24, 24, 27, .08);
            --shadow-lg: 0 12px 32px rgba(24, 24, 27, .18);
            --radius: .75rem;
        }

        [data-theme="dark"] {
            --bg: #18181B;
            --bg-subtle: #27272A;
            --text: #FAFAF8;
            --text-muted: #A1A1AA;
            --border: #3F3F46;
            --border-strong: #71717A;
            --card-bg: #27272A;
            --accent: #93C5FD;
            --accent-text: #BFDBFE;
            --accent-soft: #1E293B;
            --accent-border: #1D4ED8;
            --chip-bg: #27272A;
            --chip-text: #E4E4E7;
            --chip-active-bg: #93C5FD;
            --chip-active-text: #18181B;
            --badge-bg: #3F3F46;
            --badge-text: #E4E4E7;
            --topbar-bg: #09090B;
            --topbar-text: #FAFAF8;
            --topbar-muted: #D4D4D8;
            --danger: #FCA5A5;
            --shadow: 0 1px 2px rgba(0, 0, 0, .5);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, .6);
            --radius: .75rem;
        }

        /* ---------- Base ---------- */
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans HK', 'Noto Sans TC', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            font-size: 1rem;
            min-height: 100vh;
        }

        img { max-width: 100%; height: auto; display: block; }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        a { color: var(--accent-text); }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: .25rem;
        }

        /* ---------- Topbar ---------- */
        .topbar {
            background: var(--topbar-bg);
            color: var(--topbar-text);
            padding: .75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .topbar h1 {
            font-family: 'Noto Serif HK', serif;
            font-size: 1.25rem;
            margin: 0;
            font-weight: 700;
        }

        .topbar-muted {
            color: var(--topbar-muted);
            font-size: .875rem;
            margin: 0;
        }

        .theme-btn {
            background: transparent;
            color: var(--topbar-text);
            border: 1px solid var(--border-strong);
            border-radius: .5rem;
            min-width: 2.75rem;
            min-height: 2.75rem;
            font-size: 1.125rem;
            cursor: pointer;
        }

        /* ---------- Layout ---------- */
        .main {
            max-width: 90rem;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .page-subtitle {
            color: var(--text-muted);
            margin: 0 0 .5rem;
            font-size: 1rem;
        }

        .total-chip {
            display: inline-block;
            background: var(--badge-bg);
            color: var(--badge-text);
            border-radius: 999px;
            padding: .25rem .75rem;
            font-size: .875rem;
            font-weight: 500;
        }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            min-height: 2.75rem;
            padding: .5rem 1rem;
            border-radius: .5rem;
            border: 1px solid var(--border-strong);
            background: var(--card-bg);
            color: var(--text);
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--chip-active-text);
        }

        .btn-ghost {
            background: transparent;
            border-color: var(--border);
        }

        /* ---------- Menu (新增文章) ---------- */
        .menu-wrap { position: relative; }

        .menu {
            position: absolute;
            right: 0;
            top: calc(100% + .5rem);
            z-index: 40;
            min-width: 14rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: .375rem;
            display: flex;
            flex-direction: column;
        }

        .menu[hidden] { display: none; }

        .menu-item {
            display: block;
            padding: .625rem .75rem;
            border-radius: .5rem;
            color: var(--text);
            text-decoration: none;
            background: transparent;
            border: 0;
            font: inherit;
            text-align: start;
            cursor: pointer;
        }

        .menu-item:hover { background: var(--accent-soft); color: var(--accent-text); }

        /* ---------- KPI cards ---------- */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: .75rem;
            margin-bottom: 1.5rem;
        }

        .kpi-card {
            display: flex;
            flex-direction: column;
            gap: .25rem;
            padding: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            font: inherit;
            color: var(--text);
            text-align: start;
            min-width: 0;
            position: relative;
        }

        .kpi-card:hover { border-color: var(--accent-border); }

        .kpi-card.active {
            border-color: var(--accent);
            background: var(--accent-soft);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        .kpi-value {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .kpi-label {
            color: var(--text-muted);
            font-size: .875rem;
        }

        .kpi-check {
            position: absolute;
            top: .5rem;
            inset-inline-end: .625rem;
            font-weight: 700;
            color: var(--accent-text);
        }

        .kpi-card:not(.active) .kpi-check { visibility: hidden; }

        /* ---------- Filter bar ---------- */
        .filter-bar {
            display: flex;
            flex-direction: column;
            gap: .75rem;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: .5rem;
            min-width: 0;
        }

        .filter-label {
            font-weight: 600;
            font-size: .875rem;
            color: var(--text-muted);
            flex: 0 0 auto;
        }

        .chip-row {
            display: flex;
            gap: .5rem;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            min-width: 0;
        }

        /* Hide the horizontal scrollbar: in a flex row the scrollbar renders over
           the chips (the row's content box is exactly the chips' height), which
           looked like a grey bar cutting through the chip labels. The row still
           scrolls with a trackpad / touch drag. */
        .chip-row::-webkit-scrollbar {
            display: none;
            height: 0;
        }

        .chip {
            flex: 0 0 auto;
            min-height: 2.25rem;
            padding: .375rem .875rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--chip-bg);
            color: var(--chip-text);
            font: inherit;
            font-size: .875rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .chip:hover { border-color: var(--accent-border); }

        .chip.active {
            background: var(--chip-active-bg);
            border-color: var(--chip-active-bg);
            color: var(--chip-active-text);
        }

        /* ---------- Toolbar ---------- */
        .toolbar {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }

        .search-wrap {
            flex: 1 1 16rem;
            min-width: 0;
        }

        .search-input {
            width: 100%;
            min-height: 2.75rem;
            padding: .5rem .875rem;
            border-radius: .5rem;
            border: 1px solid var(--border-strong);
            background: var(--card-bg);
            color: var(--text);
            font: inherit;
        }

        .result-count {
            color: var(--text-muted);
            font-size: .875rem;
            white-space: nowrap;
        }

        .filter-toggle { display: none; }

        /* ---------- Article grid ---------- */
        .article-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 1.25rem;
            align-items: stretch;
        }

        .article-grid[hidden], .state-block[hidden] { display: none; }

        .article-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            cursor: pointer;
        }

        .card-cover {
            position: relative;
            aspect-ratio: 16 / 9;
            width: 100%;
            min-width: 0;
            background: linear-gradient(135deg, var(--bg-subtle), var(--border));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover-icon {
            font-size: 2rem;
            line-height: 1;
        }

        /* Placeholder cover: a designed gradient plate instead of a lone
           icon floating in empty space. Real covers replace it entirely. */
        .cover-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            padding: 1rem;
            text-align: center;
            background:
                radial-gradient(120% 90% at 50% 0%,
                    rgba(255, 255, 255, .16), transparent 62%),
                linear-gradient(140deg,
                    var(--cover-a, #3f3f46) 0%,
                    var(--cover-b, #18181b) 100%);
        }

        .cover-placeholder::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
            background-size: 2rem 2rem;
            mask-image: radial-gradient(100% 100% at 50% 50%, #000 20%, transparent 78%);
            -webkit-mask-image: radial-gradient(100% 100% at 50% 50%, #000 20%, transparent 78%);
            pointer-events: none;
        }

        .cover-glyph {
            position: relative;
            z-index: 1;
            width: 3rem;
            height: 3rem;
            display: grid;
            place-items: center;
            border-radius: .875rem;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .22);
            backdrop-filter: blur(2px);
            font-size: 1.375rem;
            line-height: 1;
        }

        .cover-word {
            position: relative;
            z-index: 1;
            font-size: .8125rem;
            font-weight: 600;
            letter-spacing: .08em;
            color: rgba(255, 255, 255, .92);
            text-transform: uppercase;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cover-sub {
            position: relative;
            z-index: 1;
            font-size: .6875rem;
            color: rgba(255, 255, 255, .66);
            letter-spacing: .04em;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cover-type {
            position: absolute;
            inset-block-end: .5rem;
            inset-inline-start: .5rem;
            background: rgba(24, 24, 27, .78);
            color: #FAFAFA;
            font-size: .75rem;
            padding: .125rem .5rem;
            border-radius: .375rem;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-width: 0;
            padding: .875rem 1rem 1rem;
            gap: .5rem;
        }

        .card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: .375rem;
            min-width: 0;
        }

        .status-badge, .content-type-badge, .platform-badge, .artist-badge {
            display: inline-block;
            font-size: .75rem;
            font-weight: 600;
            padding: .125rem .5rem;
            border-radius: .375rem;
            background: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--border);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-badge.status-draft { border-color: var(--border-strong); }
        .status-badge.status-pending { border-color: var(--accent-border); color: var(--accent-text); }
        .status-badge.status-published { border-color: var(--accent); color: var(--accent-text); }
        .status-badge.status-archived { border-color: var(--border-strong); text-decoration: underline; }

        .card-title {
            margin: 0;
            font-size: 1.0625rem;
            line-height: 1.45;
            font-weight: 700;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-width: 0;
            word-break: break-word;
        }

        .card-excerpt {
            margin: 0;
            color: var(--text-muted);
            font-size: .9375rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-width: 0;
        }

        .card-meta {
            color: var(--text-muted);
            font-size: .8125rem;
            min-width: 0;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin-top: auto;
            padding-top: .75rem;
            flex-wrap: wrap;
            position: relative;
        }

        /* The card clips its cover, so the 「更多」 menu must escape that clip:
           anchor to the actions row and render above the card edge. */
        .card-actions .menu {
            top: auto;
            bottom: calc(100% + .25rem);
            left: auto;
            right: 0;
        }

        /* Keep a 14rem menu inside narrow (1-column) viewports. */
        @media (max-width: 639px) {
            .card-actions .menu { min-width: min(14rem, calc(100vw - 3rem)); }
        }

        .card-actions button, .card-actions a {
            font: inherit;
            font-size: .875rem;
            min-height: 2.25rem;
            padding: .375rem .75rem;
            border-radius: .5rem;
            border: 1px solid var(--border-strong);
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            text-decoration: none;
        }

        /* ---------- Skeletons ---------- */
        .skeleton-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .skeleton-cover { aspect-ratio: 16 / 9; }
        .skeleton-line {
            height: .875rem;
            margin: .75rem 1rem;
            border-radius: .375rem;
            background: var(--bg-subtle);
        }

        .skeleton-line.short { width: 50%; }

        .skeleton-cover, .skeleton-line {
            background: linear-gradient(90deg, var(--bg-subtle) 25%, var(--border) 50%, var(--bg-subtle) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s linear infinite;
        }

        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        /* ---------- Empty / error ---------- */
        .state-block {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 3rem 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .75rem;
        }

        .state-block h2 { margin: 0; font-size: 1.25rem; }
        .state-block p { margin: 0; color: var(--text-muted); }
        .state-block .error-title { color: var(--danger); }

        /* ---------- Modals ---------- */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 1rem;
            overflow-y: auto;
            background: rgba(24, 24, 27, .55);
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: min(48rem, 100%);
            margin: auto;
            padding: 1.5rem;
            position: relative;
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
        }

        .modal-content h2 { margin: 0 2rem .5rem 0; font-size: 1.375rem; }

        .modal-close {
            position: absolute;
            top: .75rem;
            inset-inline-end: .75rem;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            border: 1px solid var(--border-strong);
            background: var(--card-bg);
            color: var(--text);
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
        }

        .modal-meta { color: var(--text-muted); margin-bottom: 1rem; font-size: .9375rem; }

        .modal-body { word-break: break-word; }
        .modal-body h3 { font-size: 1.125rem; margin: 1.25rem 0 .5rem; }
        .modal-body h4 { font-size: 1rem; margin: 1rem 0 .5rem; }
        .modal-body p { margin: 0 0 .875rem; }

        /* Markdown-rendered blocks: tables, lists, quotes, rules. */
        .modal-body h2 { font-size: 1.25rem; margin: 1.5rem 0 .625rem; }
        .modal-body h5 { font-size: .9375rem; margin: .875rem 0 .375rem; }
        .modal-body h6 { font-size: .875rem; margin: .875rem 0 .375rem; }
        .modal-body ul, .modal-body ol { margin: 0 0 .875rem; padding-inline-start: 1.375rem; }
        .modal-body li { margin: 0 0 .375rem; }
        .modal-body li > ul, .modal-body li > ol { margin-top: .375rem; }
        .modal-body blockquote {
            margin: 0 0 .875rem;
            padding: .5rem .875rem;
            border-inline-start: 3px solid var(--border-strong);
            background: var(--bg-subtle);
            color: var(--text-muted);
            border-radius: 0 .375rem .375rem 0;
        }
        .modal-body blockquote p:last-child { margin-bottom: 0; }
        .modal-body hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 1.25rem 0;
        }
        .modal-body strong { font-weight: 600; }
        .modal-body a { color: var(--accent); text-decoration: underline; }

        /* Locked notice shown in place of an unpublished article's body. */
        .locked-note {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .5rem;
            margin: 1.5rem 0;
            padding: 2rem 1.25rem;
            text-align: center;
            border: 1px dashed var(--border-strong);
            border-radius: .75rem;
            background: var(--bg-subtle);
            color: var(--text-muted);
        }
        .locked-note p { margin: 0; }
        .locked-note strong { color: var(--text); }
        .locked-glyph { font-size: 1.5rem; line-height: 1; }

        .modal-body .table-wrap {
            margin: 0 0 1rem;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: .5rem;
        }
        .modal-body table {
            width: 100%;
            border-collapse: collapse;
            font-size: .875rem;
            line-height: 1.5;
        }
        .modal-body th, .modal-body td {
            border-bottom: 1px solid var(--border);
            border-inline-end: 1px solid var(--border);
            padding: .5rem .75rem;
            text-align: start;
            vertical-align: top;
        }
        .modal-body th:last-child, .modal-body td:last-child { border-inline-end: 0; }
        .modal-body tbody tr:last-child td { border-bottom: 0; }
        .modal-body thead th {
            background: var(--bg-subtle);
            font-weight: 600;
            white-space: nowrap;
        }
        .modal-body tbody tr:nth-child(even) { background: var(--bg-subtle); }

        .modal-body pre, .frontmatter-template {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: .5rem;
            padding: .875rem 1rem;
            overflow-x: auto;
            font-size: .875rem;
        }

        .modal-body code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .workflow-steps { margin: 0 0 1rem; padding-inline-start: 1.25rem; }
        .workflow-steps li { margin-bottom: .375rem; }

        /* ---------- Filter drawer (mobile) ---------- */
        .filter-drawer {
            position: fixed;
            inset-inline: 0;
            inset-block-end: 0;
            z-index: 70;
            background: var(--bg);
            border-top: 1px solid var(--border);
            box-shadow: var(--shadow-lg);

<td>🇰🇷 韓國</td>\n<td>2013-01-29</td>\n<td>京畿道龍仁出生，前 Kakao Entertainment 練習生</td>\n</tr>\n<tr>\n<td><strong>OA</strong></td>\n<td>Oa Angel</td>\n<td>🇯🇵🇺🇸 日美</td>\n<td>2013-02-08</td>\n<td>⭐ 大阪出生、母親日本人父親美國人、童年住過倫敦、13 歲即成最大話題</td>\n</tr>\n<tr>\n<td><strong>AIJING</strong></td>\n<td>盛艾敬</td>\n<td>🇨🇳 中國</td>\n<td>2013-04-24</td>\n<td>Maknae，北京出生，中長跑冠軍運動員</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>國籍分佈：</strong> 韓國 3（YOUNG、VORA、AYUNE）· 中國 3（XILI、MERCI、AIJING）· 日本 1（HIMEKI）· 泰國 1（RADA）· 日美雙重國籍 1（OA）</p>\n<hr>\n<p>A2O LITE 屬於廠牌嘅 <strong>ACE universe</strong> 世界觀。官方概念係：</p>\n<blockquote>\n<p>每位成員都帶住一種由自己記憶同情緒塑成嘅顏色，而當唔同嘅顏色混埋一齊，就會生出新嘅色澤。<strong>「唔同光混埋變成新光」</strong> —— 團名就係咁嚟。</p>\n</blockquote>\n<p>同一個 universe 亦預留咗 subunit 嘅空間，即係話未來嘅企劃有機會跨成員組合。</p>\n<p>至於廠牌名 <strong>A2O = 「Alpha 2 Omega」</strong>，label 拍咗條官方影片就叫《Why Alpha 2 Omega?》去解釋。</p>\n<hr>\n<p>廠牌將《NEON》嘅風格命名為 <strong>「Zalpha Pop」</strong> —— 拆字就係 <strong>Z</strong>（Generation Z）+ <strong>Alpha</strong>（Generation Alpha），即係歌曲瞄準嘅兩代人。</p>\n<p>實際聽感：</p>\n<ul>\n<li>以<strong>厚重的低頻 bass</strong> 為中心</li>\n<li>強烈、成癮嘅 dance-pop</li>\n<li>編舞靠<strong>sharp、同步嘅陣型變化</strong>，大舞台上一眼看得出</li>\n<li>有完整 dance break、高音段落</li>\n</ul>\n<h3>製作班底：俞永鎮（Yoo Young-jin）</h3>\n<p>《NEON》嘅音樂同舞台製作由<strong>俞永鎮</strong>負責。呢位係前 SM 製作人，往績包括：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>作品</th>\n<th>藝人</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>《Mirotic》</td>\n<td>TVXQ</td>\n</tr>\n<tr>\n<td>《Genie》</td>\n<td>Girls' Generation</td>\n</tr>\n<tr>\n<td>《Ring Ding Dong》</td>\n<td>SHINee</td>\n</tr>\n<tr>\n<td>《Black Mamba》</td>\n<td>aespa</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote>\n<p>老實講，睇完《NEON》，好多長大嗰陣聽 SM 歌嘅人第一句講嘅都係「呢首好有年代感」—— 超過三分鐘、完整 dance break、大開大合高音。<strong>呢個唔係負面評價，係耳 generational resonance。</strong></p>\n</blockquote>\n<hr>\n<h3>🎵 音源榜單</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>榜單</th>\n<th>成績</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Melon Top 100</strong></td>\n<td>出道後 <strong>29 小時</strong>登頂 — 史上最快出道曲登頂紀錄 🏆</td>\n</tr>\n<tr>\n<td><strong>Melon Top 100 連莊</strong></td>\n<td><strong>連續 8 日冠軍</strong>（10/15 – 10/22）</td>\n</tr>\n<tr>\n<td><strong>Circle Chart Week 42 Global K-Pop</strong></td>\n<td><strong>1 位</strong></td>\n</tr>\n<tr>\n<td><strong>Circle Digital Chart</strong></td>\n<td><strong>1 位</strong></td>\n</tr>\n<tr>\n<td><strong>Spotify Korea Daily</strong></td>\n<td><strong>1 位</strong></td>\n</tr>\n<tr>\n<td><strong>Shazam Korea</strong></td>\n<td><strong>1 位</strong></td>\n</tr>\n<tr>\n<td><strong>Apple Music「Today's TOP 100: Global」</strong></td>\n<td><strong>4 位</strong></td>\n</tr>\n<tr>\n<td><strong>QQ 音樂（中國）</strong></td>\n<td>新歌榜 / 人氣榜 / MV 榜 <strong>三榜 1 位</strong></td>\n</tr>\n<tr>\n<td><strong>Oricon Top 100 Combined Singles</strong></td>\n<td>上榜（10/26 週榜）</td>\n</tr>\n<tr>\n<td><strong>Billboard Japan Hot 100</strong></td>\n<td>上榜</td>\n</tr>\n<tr>\n<td><strong>Billboard Global Excl. US</strong></td>\n<td>上榜（10/24 週）</td>\n</tr>\n<tr>\n<td><strong>Recorded Music NZ Hot Singles</strong></td>\n<td>上榜（10/23）</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote>\n<p>29 個鐘登 Melon 1 位呢個數字要咁睇：Melon Top 100 係「過去 24 小時 + 過去 1 小時」混合榜，即係話第二日就攞到，唔係單靠一時爆紅，係持續串流。<strong>亦快過 NewJeans。</strong></p>\n</blockquote>\n<h3>🎬 音樂節目三冠</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>日期</th>\n<th>節目</th>\n<th>成績</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>10 月 20 日</td>\n<td>SBS《The Show》</td>\n<td><strong>1 位</strong></td>\n</tr>\n<tr>\n<td>10 月 21 日</td>\n<td>MBC M《Show Champion》</td>\n<td><strong>1 位</strong></td>\n</tr>\n<tr>\n<td>10 月 22 日</td>\n<td>Mnet《M Countdown》</td>\n<td><strong>1 位</strong> ✅</td>\n</tr>\n</tbody>\n</table></div>\n<p>M Countdown 係近年被視為<strong>韓國 K-Pop 代表性打歌榜</strong>，三連冠意義唔細。</p>\n<p>獲獎後訪問：</p>\n<blockquote>\n<p>「多謝大家呢幾日嘅支持令我們可以幸福咁過。真心多謝一直支持我哋嘅粉絲，我哋會努力成為配得上呢個獎嘅歌手。」</p>\n</blockquote>\n<p>並特別多謝埋 Key Producer 李秀滿、廠牌同工作人員。</p>\n<h3>📺 MV 與舞台</h3>\n<ul>\n<li>MV 一天內 <strong>YouTube 突破 200 萬觀看</strong></li>\n<li>副歌 hook <strong>「neon and beyond」</strong> 走紅</li>\n<li>觀眾用 AI 改編 intro 做成 parody 影片</li>\n<li>官方舞台：出道 show 4K 現場版（M2 頻道）、M Countdown 首週打歌舞台 + 個人 fancam</li>\n</ul>\n<h3>🔍 搜尋熱度</h3>\n<p>Naver Datalab 數據（10/13 – 10/19 連續 7 日）：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>比較對象</th>\n<th>「A2O」搜尋量</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>股票（stock）</td>\n<td><strong>5 倍</strong></td>\n</tr>\n<tr>\n<td>天氣（weather）</td>\n<td><strong>17%</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p>即係話「A2O」嘅搜尋量係「股票」嘅五倍、係「天氣」嘅 17%。出道第一個禮拜就係咁嘅聲量。</p>\n<hr>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目</th>\n<th>資料</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>成立時間</td>\n<td>2024 年</td>\n</tr>\n<tr>\n<td>創辦人</td>\n<td><strong>李秀滿</strong>（Lee Soo-man）—— SM Entertainment 創辦人</td>\n</tr>\n<tr>\n<td>總部</td>\n<td>新加坡</td>\n</tr>\n<tr>\n<td>首個韓國出道企劃</td>\n<td>A2O LITE（女團）+ A2O SOUL（男團）</td>\n</tr>\n</tbody>\n</table></div>\n<h3>李秀滿點解要自己再開一間廠牌？</h3>\n<ol>\n<li><strong>2023 年離開 SM</strong>，2024 年自立門戶</li>\n<li><strong>2025 年將 SM 股份賣畀 HYBE</strong>，但附帶 <strong>3 年競業禁止協議</strong> —— 協議到 <strong>2026 年 2 月</strong>先到期，即係話佢喺韓國本地要等過咗呢個先可以合法做娛樂業務</li>\n<li>所以 A2O 頭兩年<strong>主攻中國同美國市場</strong>，2024 年 10 月先用 performance video 公開第一批練習生 <strong>A2O Rookies</strong>（名單入面部分人之後就係 A2O LITE 成員）</li>\n<li><strong>2026 年 2 月競業期一到，即刻啟動韓國本土出道</strong> —— 10 月 8 日開官方 SNS，10 月 12 日 showcase，10 月 13 日發歌</li>\n</ol>\n<h3>一晚推兩個團：反傳統嘅玩法</h3>\n<p>A2O SOUL（15 人男團，《SUPERSTAR》）同 A2O LITE <strong>同一晚、同一個 show、同一個 universe</strong> 出道。</p>\n<p>多間媒體形容呢個做法在業內極為罕見。一般廠牌會把新團分開推，讓各自的 fandom 分頭成長；A2O 反其道而行，要一班觀眾一次過接納 <strong>24 個成員</strong>同一個世界觀。</p>\n<p><strong>秀場安排：</strong> 兩團先有一段 joint dance → A2O LITE 出舞台 → A2O SOUL 收尾。</p>\n<p><strong>另一個破格位：</strong> 冇開記者會，藝人只表演、不答記者提問。</p>\n<h3>李秀滿喺 show 上嘅訊息</h3>\n<blockquote>\n<p>「一切都由歌開始。」佢話，任何聲稱自己「同現有 K-Pop 不同」嘅講法，都要由音樂本身開始 —— <strong>先覺得一首歌好，再去判斷佢新喺邊。</strong></p>\n</blockquote>\n<hr>\n<p>今次唔止有音樂，廠牌仲show咗技術牌：</p>\n<h3>4DGS（Four-Dimensional Gaussian Splatting）</h3>\n<ul>\n<li>同 <strong>Samsung Electronics</strong> 合作開發</li>\n<li>360 度記錄演出空間</li>\n<li>觀眾戴上 <strong>VR 頭盔</strong>可以行入成員中間、由後方觀看陣型</li>\n<li>李秀滿定位為 <strong>Matrix Camera System</strong>（當年 Girls' Generation、SHINee、TVXQ、BoA MV 用嘅技術，由靜態相片變成影片）嘅接棒者</li>\n</ul>\n<h3>Blooming Talk</h3>\n<p>AI 動能粉絲平台，粉絲可以同藝人、亦同成員嘅 AI avatar 對話。</p>\n<hr>\n<p>呢個係出道後最熱嘅討論點。</p>\n<ul>\n<li><strong>OA 只有 13 歲</strong>（2013 年 2 月 8 日生）—— 日美混血、大阪出生、母親日本人父親美國人、童年喺倫敦生活過</li>\n<li>佢嘅 solo 表演同外貌令佢喺網上迅速累積話題，粉絲搜尋量遠高於其他成員</li>\n<li>有媒體形容佢同前 Girls' Generation 成員 <strong>Jessica Jung</strong> 撞樣；<strong>AIJING</strong> 就被拿來同 <strong>BoA</strong> 比較</li>\n</ul>\n<p>韓國媒體兩週內出咗兩篇針對性報道：Koreaboo 嘅「人氣新女團因多名成員年齡過小被批」、《Korea Times》10 月 22 日封面故事《Kids on Stage: How Young Is Too Young to Debut in K-pop?》（Marie Claire Taiwan 亦專文講 OA 呢個 13 歲混血成員）。</p>\n<p><strong>觀察重點：</strong> A2O 呢批成員平均年齡大約 16–17 歲，出道時最細 13 歲。呢個係廠牌刻意嘅「Zalpha Pop」定位一部分 —— 直接對住 Z 世代同 Alpha 世代。但佢同時係韓國偶像制度多年嚟爭議嘅「未成年出道」課題上，擺得最前嘅位置。</p>\n<p><strong>OA 其他背景：</strong> 前兒童模特、2025 年同 A2O Rookies 嘅 David 合唱《Summer Night》、 audition song 係 IVE《LOVE DIVE》。</p>\n<p><strong>AIJING 其他背景：</strong> 北京出生、做過長跑冠軍運動員。</p>\n<hr>\n<p><strong>1. 舊時代嘅味道，撞正新世代嘅包裝</strong><br>\n《NEON》嘅音樂語言同俞永鎮年代幾乎一模一樣，但目標受眾係 Z + Alpha 世代。呢種「老配方新載體」喺 2026 年反而係差異化 —— 太多新團都係用 Y2K 復古做糖衣。</p>\n<p><strong>2. 名字本身就係最大聲量機器</strong><br>\n「A2O」嘅搜尋量做到係「股票」五倍、係「天氣」17%，呢個唔係歌嘅功勞，係<strong>廠牌級別嘅 universe 設計</strong>做咗好。</p>\n<p><strong>3. 一晚 24 人，風險同機會並存</strong><br>\n好處：一次過建立聲量，唔使分開養兩個 fandom；壞處：24 個人要一個觀眾記住，難度係單團嘅幾倍。<strong>「NEON」pass 咗第一關，但 ACE universe 係咪值得住，要睇之後嘅單曲。</strong></p>\n<p><strong>4. 國際化唔止係成員國籍</strong><br>\nQQ 音樂三榜 1 位（中國）、Apple Music Global 4 位、Oricon / Billboard Japan / NZ / Billboard Global 全部上榜 —— 中日紐澳同步走。呢個同 A2O 喺競業期主攻海外嘅戰略係一致嘅。</p>\n<hr>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>平台</th>\n<th>連結</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>官網</td>\n<td>https://a2olite.world/</td>\n</tr>\n<tr>\n<td>YouTube</td>\n<td>@A2OLITE</td>\n</tr>\n<tr>\n<td>Instagram</td>\n<td>@a2o.lite</td>\n</tr>\n<tr>\n<td>X</td>\n<td>@A2O_LITE</td>\n</tr>\n<tr>\n<td>TikTok</td>\n<td>@a2o.lite</td>\n</tr>\n<tr>\n<td>Weibo</td>\n<td>@A2O_LITE</td>\n</tr>\n<tr>\n<td>Bilibili</td>\n<td>A2O LITE</td>\n</tr>\n<tr>\n<td>Douyin</td>\n<td>A2O LITE</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>企劃世界觀影片：</strong>《Why Alpha 2 Omega?》（A2O WORLD 官方 YouTube）</p>\n<hr>\n<p>Wikipedia（A2O Lite / A2O Entertainment）· Korea Herald · Korea JoongAng Daily · The Chosun Ilbo · Sports Kyunghyang · Xports News · Newsis · No Cut News · STARNEWS · Ten Asia · Korea Times · Harper's Bazaar Korea · Marie Claire Taiwan · KProfiles · KpopVisage · KpopBio · Beautipin Seoul · Circle Chart · Oricon · Billboard Japan · Billboard Global · Recorded Music NZ · Naver Datalab</p>\n<hr>\n<p><em>報告時間：2026-10-24 | 資料截至 2026 年 10 月 23 日（Melon 8 連莊最後紀錄日）</em></p>", "cover": "", "sourcePath": "", "sourceUrl": ""}, {"id": 1, "title": "《璀璨之城》— 22點嘅首播係真定係「空窗效應」？", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-10-22", "created": "2026-10-22", "updated": "2026-10-22", "status": "review", "statusLabel": "待發布", "platforms": ["tvb"], "platformLabels": ["TVB"], "platform": "TVB", "artist": "", "tags": ["TVB, 商戰劇, 豪門, 張智霖, 吳卓羲, 高海寧, 張曦雯, 劇評"], "preview": "此文章尚未公開，草稿內容只保留喺本地創作空間。", "content": "<div class=\"locked-note\"><span class=\"locked-glyph\" aria-hidden=\"true\">🔒</span><p><strong>此文章尚未公開</strong></p><p>草稿內容只保留喺本地創作空間，唔會出現喺公開版 Dashboard。</p></div>", "cover": "", "sourcePath": "", "sourceUrl": ""}, {"id": 2, "title": "《翻身蜜語》— 朱珠從谷底反彈的都市童話", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-09-01", "created": "2026-09-01", "updated": "2026-10-22", "status": "review", "statusLabel": "待發布", "platforms": ["tvb"], "platformLabels": ["TVB"], "platform": "TVB", "artist": "", "tags": ["TVB, 時裝劇, 都市情感, 翻身蜜語, 朱珠, 鍾漢良"], "preview": "此文章尚未公開，草稿內容只保留喺本地創作空間。", "content": "<div class=\"locked-note\"><span class=\"locked-glyph\" aria-hidden=\"true\">🔒</span><p><strong>此文章尚未公開</strong></p><p>草稿內容只保留喺本地創作空間，唔會出現喺公開版 Dashboard。</p></div>", "cover": "", "sourcePath": "", "sourceUrl": ""}, {"id": 3, "title": "TUIDE vs OURBIRTHDAY — 同期出道深度對比分析", "contentType": "kpop", "contentTypeLabel": "K-Pop", "content_type": "kpop", "date": "2026-08-29", "created": "2026-08-29", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": [], "platformLabels": [], "platform": "K-Pop", "artist": "", "tags": ["TUIDE, OURBIRTHDAY, HYBE, JYP, ABD, Innit, K-Pop, GirlGroup, 2026新團, Soultronic, Whip-hop"], "preview": "作者：創作室｜2026-08-29 2026 年 8 月，韓國兩大龍頭公司 HYBE 同 JYP 幾乎同一時間，分別推出全新女團： TUIDE OURBIRTHDAY Label ABD (HYBE 子公司) Innit Entertain...", "content": "<p><strong>作者：創作室｜2026-08-29</strong></p>\n<hr>\n<p>2026 年 8 月，韓國兩大龍頭公司 HYBE 同 JYP 幾乎同一時間，分別推出全新女團：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>TUIDE</strong></th>\n<th><strong>OURBIRTHDAY</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Label</strong></td>\n<td>ABD (HYBE 子公司)</td>\n<td>Innit Entertainment (JYP 子公司)</td>\n</tr>\n<tr>\n<td><strong>出道日期</strong></td>\n<td>2026-08-24</td>\n<td>2026-08-19</td>\n</tr>\n<tr>\n<td><strong>出道日距</strong></td>\n<td>—</td>\n<td>早 5 日</td>\n</tr>\n<tr>\n<td><strong>EP/專輯</strong></td>\n<td>《TUNE &amp; PLAY》5曲</td>\n<td>《Our Birthday》4曲</td>\n</tr>\n<tr>\n<td><strong>主打歌</strong></td>\n<td>SUN KISS</td>\n<td>SQUEEZY</td>\n</tr>\n<tr>\n<td><strong>人數</strong></td>\n<td>7人</td>\n<td>7人</td>\n</tr>\n</tbody>\n</table></div>\n<p>兩團狹路相逢，正面交鋒，業界矚目。</p>\n<hr>\n<h3>TUIDE — 七人跨國陣容</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>名字</th>\n<th>國籍</th>\n<th>亮點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>SEOHEE</strong></td>\n<td>🇰🇷 韓國</td>\n<td>主力的實力派</td>\n</tr>\n<tr>\n<td><strong>SEOYEON</strong></td>\n<td>🇰🇷 韓國</td>\n<td>⭐ <strong>TWICE 隊長 Jihyo 親妹妹</strong></td>\n</tr>\n<tr>\n<td><strong>ELENA</strong></td>\n<td>🇺🇸 美國</td>\n<td>R&amp;B 音色，「groovy tone」擔當</td>\n</tr>\n<tr>\n<td><strong>JIA</strong></td>\n<td>🇬🇧 英國</td>\n<td>語言擔當</td>\n</tr>\n<tr>\n<td><strong>SAKI</strong></td>\n<td>🇯🇵 日本</td>\n<td>細個已經夢想喺韓國出道</td>\n</tr>\n<tr>\n<td><strong>SEAH</strong></td>\n<td>🇰🇷 韓國</td>\n<td>發布會發言代表</td>\n</tr>\n<tr>\n<td><strong>YI HANI</strong></td>\n<td>🇰🇷 韓國</td>\n<td>視覺擔當</td>\n</tr>\n</tbody>\n</table></div>\n<h3>OURBIRTHDAY — 七人跨國陣容</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>名字</th>\n<th>國籍</th>\n<th>亮點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Guk Cho-rok</strong></td>\n<td>🇰🇷 韓國</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>Shin Hye-won</strong></td>\n<td>🇰🇷 韓國</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>Cho Hye-jin</strong></td>\n<td>🇰🇷 韓國</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>U</strong></td>\n<td>🇰🇷 韓國</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>Baby</strong></td>\n<td>🇹🇭 泰國</td>\n<td>海外市場注目</td>\n</tr>\n<tr>\n<td><strong>Achiraya</strong></td>\n<td>🇹🇭 泰國</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>Kirala</strong></td>\n<td>🇹🇭 泰國</td>\n<td>—</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>TUIDE 成員國籍：</strong> 🇰🇷🇺🇸🇬🇧🇯🇵 四國<br>\n<strong>OURBIRTHDAY 成員國籍：</strong> 🇰🇷🇹🇭 兩國（三人泰籍）</p>\n<hr>\n<h3>TUIDE — Soultronic Pop</h3>\n<blockquote>\n<p><strong>「Tune the Tide」— 用音樂引領潮流</strong></p>\n</blockquote>\n<ul>\n<li>定義為 <strong>「Soultronic」</strong>：Neo-soul 暖感 + 電子拋光</li>\n<li>風格遊走：R&amp;B、House、UK Garage</li>\n<li>全碟由 <strong>GroovyRoom</strong> 聯手製作</li>\n<li><strong>《Echo》取樣 Janet Jackson《All for You》(2001)</strong> — 向經典致敬</li>\n<li>五首歌全部打入 Melon Hot 100</li>\n</ul>\n<p><strong>曲風評價：</strong> 偏向成人向、質感優先、風格鮮明</p>\n<h3>OURBIRTHDAY — Whip-hop / Dance</h3>\n<blockquote>\n<p><strong>「Today is our birthday!」</strong></p>\n</blockquote>\n<ul>\n<li>主打 <strong>SQUEEZY</strong> 以 <strong>whip-hop</strong> 元素做骨幹</li>\n<li>JYP 內部製作班底</li>\n<li>出道 Show《OURBIRTHDAY PARTY》喺 Blue Square 舉行</li>\n<li>風格偏向年輕市場、活力 party vibe</li>\n<li>先行曲《HUNGRY (Side A/B)》7月已預先發布</li>\n</ul>\n<p><strong>曲風評價：</strong> 偏向青春活力，洗腦 hook、舞台感優先</p>\n<hr>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>TUIDE</strong></th>\n<th><strong>OURBIRTHDAY</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>最大話題</strong></td>\n<td>Seoyeon = Jihyo 親妹妹</td>\n<td>JYP 2026 唯一新女團</td>\n</tr>\n<tr>\n<td><strong>預期關注</strong></td>\n<td>極高（Jihyo效應）</td>\n<td>中等（JYP 基本盤）</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Jihyo效應：</strong> Seoyeon 作為 TWICE 隊長細妹，未出道已經全球粉絲矚目。呢個係 OURBIRTHDAY 完全冇嘅先天優勢。</p>\n<hr>\n<h3>🎵 音源成績</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>TUIDE</strong></th>\n<th><strong>OURBIRTHDAY</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Melon Hot 100</strong></td>\n<td>✅ 全5首歌全部上榜</td>\n<td>❌ 未打入 Hot 100</td>\n</tr>\n<tr>\n<td><strong>主打最高位</strong></td>\n<td>SUN KISS <strong>#16</strong></td>\n<td>SQUEEZY 未上榜</td>\n</tr>\n<tr>\n<td><strong>Melon Daily Chart</strong></td>\n<td>#349 出道日</td>\n<td>未見上榜記錄</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>業界評價：</strong> Reddit/kpop 討論區直接形容 SQUEEZY 為「<strong>JYP 歷史上最弱出道</strong>」（the weakest debut ever）。</p>\n<h3>💿 實體專輯銷量（Hanteo）</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>TUIDE</strong></th>\n<th><strong>OURBIRTHDAY</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>專輯版本</strong></td>\n<td>未公布</td>\n<td>5種版本（Welcome/Party/Coloring Book/Fans Album）</td>\n</tr>\n<tr>\n<td><strong>Hanteo 首週銷量</strong></td>\n<td>約 <strong>89,000 張</strong></td>\n<td>未打入 Top 100（首週極低）</td>\n</tr>\n</tbody>\n</table></div>\n<h3>📺 MV / Music Show</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>TUIDE</strong></th>\n<th><strong>OURBIRTHDAY</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>M Countdown 出道舞台</strong></td>\n<td>✅ 已出演</td>\n<td>✅ 已出演</td>\n</tr>\n<tr>\n<td><strong>QQ / YouTube</strong></td>\n<td>全球播放量穩步上升</td>\n<td>已有 MV 發布</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n<h3>兩團共同面對嘅問題</h3>\n<p><strong>1. 市場饱和</strong><br>\n2026 年係韓國女團爆發年。除咗 TUIDE 同 OURBIRTHDAY，仲有：<br>\n- SM 的 <strong>Hearts2Hearts</strong>（8月10日出道）<br>\n- 多個已出道女團持续活动（BABYMONSTER、ILLIT、NewJeans 等）</p>\n<p>粉絲注意力被嚴重分散，新團出道初期曝光窗口極短。</p>\n<p><strong>2. 公司子公司模式嘅風險</strong><br>\nABD（A Bold Dream）係 HYBE 旗下首個女團專門 label，<strong>成立於 2026 年 5 月 8 日</strong>，歴史極短。ABD Executive Producer 韓成秀（Pledis 創辦人）有 SEVENTEEN、After School 往績，但新 label = 沒有粉絲根基。</p>\n<p>Innit Entertainment（JYP 子公司）同樣係新架構，JYP 2026 年主攻多个新團项目，内部資源分配存疑。</p>\n<p><strong>3. 同期出道時間太近</strong><br>\n兩團只差 5 日，幾乎不可能獲得各自獨立的首周輿論窗口。傳媒、K-pop 粉絲同一時間接收兩個新團出道資訊，稀釋效應明顯。</p>\n<hr>\n<h3>TUIDE 個別問題</h3>\n<p><strong>問題 A：期望值過高</strong><br>\nSeoyeon 作為 Jihyo 細妹，粉丝期望極高。Jihyo 係 TWICE 隊長、TOP 女偶像之一。Seoyeon 無論點表現，都会被放大比較，壓力極大。</p>\n<p><strong>問題 B：風格定位偏成熟</strong><br>\nSoultronic Pop 質感優先，但當前 K-pop 市场主流仍偏向「易消化」的 hook-driven 曲目。TUIDE 嘅風格可能需要時間建立受眾。</p>\n<p><strong>問題 C：ABD 無粉絲基本盤</strong><br>\n新 label = 零粉絲。TUIDE 需要由零建立 audience，而唔係依靠任何現有粉絲團體。</p>\n<hr>\n<h3>OURBIRTHDAY 個別問題</h3>\n<p><strong>問題 A：話題性不足</strong><br>\n除咗 JYP 基本盤，OURBIRTHDAY 冇類似「Jihyo 細妹」呢類爆點話題。三人泰籍成員有海外市場潛力，但泰國 K-pop 粉絲基本盤遠細過日本/美國。</p>\n<p><strong>問題 B：風格撞型</strong><br>\nWhip-hop / party dance 風格喺 K-pop 唔係新嘢。ILLIT、NewJeans 乃至 BABYMONSTER 都有類似元素，OURBIRTHDAY 難以單靠風格突围。</p>\n<p><strong>問題 C：出道成績遠低於預期</strong><br>\nJYP 4年來首個新女團，但 SQUEEZY 完全未打入 Melon Hot 100，被評為「最弱出道」。即使有5種實體版本，首週銷量仍然未打入 Hanteo Top 100。</p>\n<p><strong>問題 D：JYP 2026 項目過多</strong><br>\nJYP 同期有多個新團计划（GPP、若干未知項目），Innit Entertainment 能獲得多少資源支持存疑。</p>\n<hr>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>維度</th>\n<th>TUIDE</th>\n<th>OURBIRTHDAY</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>話題性</strong></td>\n<td>✅ Jihyo效應，全球矚目</td>\n<td>⚠️ JYP 基本盤</td>\n</tr>\n<tr>\n<td><strong>成員多元</strong></td>\n<td>✅ 四國國籍，語言多</td>\n<td>⚠️ 泰+韓為主</td>\n</tr>\n<tr>\n<td><strong>音樂風格</strong></td>\n<td>✅ 差异化，質感鮮明</td>\n<td>⚠️ 風格撞型</td>\n</tr>\n<tr>\n<td><strong>Melon Hot 100</strong></td>\n<td>✅ 全5曲上榜，主打#16</td>\n<td>❌ 完全未上榜</td>\n</tr>\n<tr>\n<td><strong>實體銷量</strong></td>\n<td>✅ ~89,000張（Hanteo）</td>\n<td>❌ 未打入Top 100</td>\n</tr>\n<tr>\n<td><strong>公司資源</strong></td>\n<td>⚠️ 新 label，零根基</td>\n<td>✅ JYP 品牌加持</td>\n</tr>\n<tr>\n<td><strong>出道時機</strong></td>\n<td>⚠️ 遲5日</td>\n<td>✅ 早5日</td>\n</tr>\n<tr>\n<td><strong>成員亮點</strong></td>\n<td>✅ Seoyeon</td>\n<td>⚠️ 無特別亮點</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n<p><strong>出道成績：TUIDE 碾壓性勝出</strong></p>\n<ul>\n<li>Melon Hot 100 全上（#16）+ 89K Hanteo銷量</li>\n<li>OURBIRTHDAY 完全未上榜 + 被評為「最弱出道」</li>\n</ul>\n<p>呢個結果唔單止係公關 / 話題嘅問題，係直接反映喺音源榜成績上。</p>\n<p><strong>短期（3個月內）：TUIDE 繼續領先</strong></p>\n<ul>\n<li>Jihyo效應令 TUIDE 自帶全球流量</li>\n<li>Soultronic 風格差异化，即使討論度低，風格已足够鮮明令粉絲记住</li>\n<li>Melon 全5曲上榜已證明基本號召力</li>\n</ul>\n<p><strong>中期（6-12個月）：取決於 ABD 營運策略</strong></p>\n<ul>\n<li>ABD 若能善用 HYBE 資源（包含 BTS、SEVENTEEN、NewJeans 粉絲導流），TUIDE 有機會快速建立基本盤</li>\n<li>若 ABD 保守營運，TUIDE 可能淪為「有話題無成績」</li>\n</ul>\n<p><strong>OURBIRTHDAY 需要觀察：</strong></p>\n<ul>\n<li>SQUEEZY 能否喺短時間内形成洗腦效應？</li>\n<li>三人泰籍成員能否喺東南亞市場打開局面？</li>\n<li>JYP 會否投入資源支持，還是放任佢哋自然發展？</li>\n</ul>\n<p><strong>兩個團都面對同一個根本問題：2026 年新團太多，粉絲唔夠用。</strong></p>\n<hr>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>公司</th>\n<th>團名</th>\n<th>状態</th>\n<th>人數</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>HYBE</td>\n<td><strong>TUIDE</strong></td>\n<td>✅ 8月24日出道</td>\n<td>7人</td>\n</tr>\n<tr>\n<td>SM</td>\n<td><strong>Hearts2Hearts</strong></td>\n<td>✅ 8月10日出道</td>\n<td>未定</td>\n</tr>\n<tr>\n<td>JYP</td>\n<td><strong>OURBIRTHDAY</strong></td>\n<td>✅ 8月19日出道</td>\n<td>7人</td>\n</tr>\n<tr>\n<td>YG</td>\n<td>BABYMONSTER</td>\n<td>2024 已出道</td>\n<td>7人</td>\n</tr>\n<tr>\n<td>YG</td>\n<td>NEXT MONSTER（暫名）</td>\n<td>醞釀中</td>\n<td>未定</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n<p><em>資料來源：Chosun、STARNEWS、Korea JoongAng Daily、Wikipedia、Kpop Wiki、Fandom、Kprofiles、Kpopping、Reddit r/kpop、Hanteo News｜報告時間：2026-08-29</em></p>", "cover": "", "sourcePath": "", "sourceUrl": ""}, {"id": 4, "title": "TUIDE 出道深度報告 — HYBE 2026 年度重量級新人", "contentType": "kpop", "contentTypeLabel": "K-Pop", "content_type": "kpop", "date": "2026-08-26", "created": "2026-08-26", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": [], "platformLabels": [], "platform": "K-Pop", "artist": "", "tags": ["TUIDE, HYBE, ABD, K-Pop, GirlGroup, Soultronic, 2026新團"], "preview": "出道日期： 2026 年 8 月 24 日 EP：《TUNE & PLAY》 （5 首歌） Label： ABD（A Bold Dream）— HYBE 旗下首個女團專門 label 名字 國籍 亮點 SEOHEE 🇰🇷 韓國 — SEOY...", "content": "<p><strong>出道日期：</strong> 2026 年 8 月 24 日<br>\n<strong>EP：《TUNE &amp; PLAY》</strong>（5 首歌）<br>\n<strong>Label：</strong> ABD（A Bold Dream）— HYBE 旗下首個女團專門 label</p>\n<hr>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>名字</th>\n<th>國籍</th>\n<th>亮點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>SEOHEE</strong></td>\n<td>🇰🇷 韓國</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>SEOYEON</strong></td>\n<td>🇰🇷 韓國</td>\n<td>⭐ TWICE 隊長 Jihyo 親妹妹</td>\n</tr>\n<tr>\n<td><strong>ELENA</strong></td>\n<td>🇺🇸 美國</td>\n<td>R&amp;B 音色，「groovy tone」擔當</td>\n</tr>\n<tr>\n<td><strong>JIA</strong></td>\n<td>🇬🇧 英國</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>SAKI</strong></td>\n<td>🇯🇵 日本</td>\n<td>細個已經夢想喺韓國出道</td>\n</tr>\n<tr>\n<td><strong>SEAH</strong></td>\n<td>🇰🇷 韓國</td>\n<td>發布會發言代表</td>\n</tr>\n<tr>\n<td><strong>YI HANI</strong></td>\n<td>🇰🇷 韓國</td>\n<td>—</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n<p><strong>TUIDE = \"Tune the Tide\"</strong> — 意思係「自己話語自己導向」，希望引領音樂潮流</p>\n<hr>\n<p>EP 被定義為 <strong>「Soultronic」</strong>：<br>\n- Neo-soul 暖感合成音色 + 電子音樂拋光<br>\n- 風格遊走於 R&amp;B、House、UK Garage 之間<br>\n- 全碟由 <strong>GroovyRoom</strong> 製作<br>\n- 其中《Echo》取樣了 Janet Jackson《All for You》(2001)</p>\n<p><strong>五首歌：</strong><br>\n1. <strong>SUN KISS</strong> — 主力主打，關於信任直覺、活在當下<br>\n2. <strong>ABD</strong> — label 同名曲<br>\n3. <strong>Echo</strong> — Janet Jackson 取樣<br>\n4. <strong>Flip-Flop Girl</strong><br>\n5. <strong>GRLS</strong></p>\n<hr>\n<p>TUIDE 係 ABD 旗下第一個打着「<strong>全球女團</strong>」旗號嘅組合：<br>\n- 成員來自 🇰🇷🇺🇸🇬🇧🇯🇵 四個國家<br>\n- 語言混合韓、英、日、法四國語<br>\n- 8 月 1-2 日搞過 <strong>TUIDE EXCLUSIVE PREVIEW [PLAYGROUND]</strong> 粉絲 Showcase<br>\n- 出道 Show《OURBIRTHDAY PARTY》（其實係另一團，但時間相近造成比較）</p>\n<hr>\n<p><strong>Seoyeon 係 TWICE 隊長 Jihyo 嘅親妹妹</strong> — 呢點令 TUIDE 未出道已經有高度關注。Jihyo 送咗句說話俾妹妹：</p>\n<blockquote>\n<p><em>「我哋會見隊友多過見自己屋企人，所以要互相撐住，先可以行得更遠。」</em></p>\n</blockquote>\n<hr>\n<h3>🎵 音源成績</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>榜單</th>\n<th>成績</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Melon Hot 100</strong></td>\n<td>全 5 首歌<strong>全部上榜</strong></td>\n</tr>\n<tr>\n<td><strong>SUN KISS（主打）</strong></td>\n<td>最高第 <strong>16 位</strong></td>\n</tr>\n<tr>\n<td>先行曲 GRLS</td>\n<td>也有上榜</td>\n</tr>\n</tbody>\n</table></div>\n<h3>🎬 MV 成績</h3>\n<ul>\n<li>《SUN KISS》MV 喺 8 月 25 日發布</li>\n<li>全球播放量穩步上升</li>\n</ul>\n<h3>📺 音樂節目</h3>\n<ul>\n<li>8 月 24 日 Showcase 完成（YES24 Live Hall）</li>\n<li>陸續出演各音樂節目</li>\n</ul>\n<hr>\n<p>ABD 係 HYBE 2026 年 5 月 8 日正式成立嘅女團專門 label：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目</th>\n<th>資料</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>成立時間</strong></td>\n<td>2026 年 5 月 8 日</td>\n</tr>\n<tr>\n<td><strong>定位</strong></td>\n<td>女團專門 Production Label</td>\n</tr>\n<tr>\n<td><strong>Executive Producer</strong></td>\n<td><strong>韓成秀</strong>（Pledis 創辦人）</td>\n</tr>\n<tr>\n<td><strong>Producer 往績</strong></td>\n<td>SEVENTEEN、After School、IZ*ONE、TWS</td>\n</tr>\n<tr>\n<td><strong>Label Head</strong></td>\n<td>Jiwon No（前 Pledis 藝人策劃主管）</td>\n</tr>\n<tr>\n<td><strong>口號</strong></td>\n<td>「不傳統、灵活、玩味」，打破常規</td>\n</tr>\n<tr>\n<td><strong>全球 auditions</strong></td>\n<td>韓國、印度（10 個城市）</td>\n</tr>\n</tbody>\n</table></div>\n<h3>理念</h3>\n<blockquote>\n<p><em>「Guided by a deep understanding of both artists and fans, the new label aims to pursue the intrinsic joy of music while exploring new possibilities and expanding the horizons of K-pop」</em><br>\n— HYBE 官方聲明</p>\n</blockquote>\n<hr>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>TUIDE</th>\n<th>OURBIRTHDAY</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>公司</strong></td>\n<td>HYBE（ABD）</td>\n<td>JYP Entertainment</td>\n</tr>\n<tr>\n<td><strong>出道日期</strong></td>\n<td>2026 年 8 月 24 日</td>\n<td>2026 年 8 月 19 日</td>\n</tr>\n<tr>\n<td><strong>人數</strong></td>\n<td><strong>7 人</strong></td>\n<td><strong>7 人</strong></td>\n</tr>\n<tr>\n<td><strong>風格</strong></td>\n<td>Soultronic Pop（Neo-soul + 電子）</td>\n<td>風格待確認</td>\n</tr>\n<tr>\n<td><strong>出道模式</strong></td>\n<td>Brand films + Showcase</td>\n<td>直播出道 Show</td>\n</tr>\n<tr>\n<td><strong>Producer</strong></td>\n<td>韓成秀（ABD）</td>\n<td>JYP Entertainment</td>\n</tr>\n<tr>\n<td><strong>話題成員</strong></td>\n<td>Seoyeon（Jihyo 妹妹）</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>Melon 成績</strong></td>\n<td>全 track 上榜 / 最高 #16</td>\n<td>待確認</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote>\n<p>⚠️ 兩團同日/近距離出道（只差 5 日），人數相同（各 7 人），係 2026 年 8 月韓國女團市場最直接嘅競爭對手。</p>\n</blockquote>\n<hr>\n<p><strong>優點：</strong><br>\n- 跨國背景配合 HYBE 全球野心<br>\n- Soultronic 定位清晰，唔走傳統 girl group 甜美風<br>\n- GroovyRoom 背書，音樂質素有保證<br>\n- Jihyo 妹妹光環自帶流量<br>\n- 先行 Showcase 反應正面，現場演出有一定說服力</p>\n<p><strong>觀望位：</strong><br>\n- 七人太多？市場短期內有 OURBIRTHDAY（7人）、BABYMONSTER（7人）競爭<br>\n- Soultronic 定位偏清新，香港/台灣粉絲反應待觀察<br>\n- 同期 HEARTS2HEARTS（日本市場）搶緊同一批粉<br>\n- 七人各國成員語言協調係實際運作挑戰</p>\n<hr>\n<h3>🩷 SM Entertainment — Hearts2Hearts</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目</th>\n<th>資料</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>出道</strong></td>\n<td>2026 年 8 月 10 日 ✅ 已出道</td>\n</tr>\n<tr>\n<td><strong>出道曲</strong></td>\n<td>日文單曲《Iconic Heart》</td>\n</tr>\n<tr>\n<td><strong>特別</strong></td>\n<td>SM 旗下第二個日系女團（唔係韓團）</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote>\n<p>另外 SM 日本部仲有個全日文女團 <strong>GPP</strong>，預計 2026 年初出道，隸屬 SM Entertainment Japan。</p>\n</blockquote>\n<hr>\n<h3>💚 JYP Entertainment — OURBIRTHDAY</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目</th>\n<th>資料</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>出道</strong></td>\n<td>2026 年 8 月 19 日 ✅ 已出道</td>\n</tr>\n<tr>\n<td><strong>人數</strong></td>\n<td><strong>7 人</strong>（Guk Cho-rok、Shin Hye-won、Cho Hye-jin、Yu、Baby、Achiraya、Kirara）</td>\n</tr>\n<tr>\n<td><strong>出道 Show</strong></td>\n<td>《OURBIRTHDAY PARTY》</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote>\n<p>⚠️ JYP 原本預告係 4 人團，但最後變成 <strong>7 人</strong>，算係今年最大 surprise。TUIDE 同日/近距離出道，市場直接競爭。</p>\n</blockquote>\n<hr>\n<h3>💜 YG Entertainment — BABYMONSTER + NEXT MONSTER</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>團名</th>\n<th>狀態</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>BABYMONSTER</strong></td>\n<td>已出道，2026 繼續世界巡迴，新歌《Choom》《Sugar Honey Ice Tea》</td>\n</tr>\n<tr>\n<td><strong>NEXT MONSTER</strong>（暫名）</td>\n<td>2026 持續曝光中，新成員 Kayci（13 歲）已曝光</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote>\n<p>⚠️ YG 今年主攻 BABYMONSTER 同新男團，<strong>未官方確認有全新女團</strong>喺 2026 出道。</p>\n</blockquote>\n<hr>\n<h3>📊 四大公司新女團一覽表</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>公司</th>\n<th>團名</th>\n<th>状態</th>\n<th>人數</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>HYBE</td>\n<td><strong>TUIDE</strong></td>\n<td>✅ 8月24日出道</td>\n<td>7 人</td>\n</tr>\n<tr>\n<td>SM</td>\n<td><strong>Hearts2Hearts</strong></td>\n<td>✅ 8月10日出道</td>\n<td>未定</td>\n</tr>\n<tr>\n<td>SM</td>\n<td><strong>GPP</strong></td>\n<td>2026 上半年</td>\n<td>未定</td>\n</tr>\n<tr>\n<td>JYP</td>\n<td><strong>OURBIRTHDAY</strong></td>\n<td>✅ 8月19日出道</td>\n<td><strong>7 人</strong></td>\n</tr>\n<tr>\n<td>YG</td>\n<td>BABYMONSTER</td>\n<td>2024 已出道</td>\n<td>7 人</td>\n</tr>\n<tr>\n<td>YG</td>\n<td>NEXT MONSTER（暫名）</td>\n<td>醞釀中</td>\n<td>未定</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n<blockquote>\n<p>⚠️ 以下資料未獲官方確認，僅供參考：</p>\n<ul>\n<li><strong>ABD 第三個女團</strong>：預計 mix After School 舊成員 + PinkPantheress？預計 2026 年底或 2027 年頭，但未 official confirm</li>\n<li><strong>HYBE × Geffen 新女團</strong>：緊接 KATSEYE 之後第二隊合作團體，預計 2026 年中旬有消息</li>\n</ul>\n</blockquote>\n<hr>\n<p><em>報告時間：2026-08-26 | 資料來源：Chosun、STARNEWS、Firstpost、Korea Times、Soompi</em></p>", "cover": "", "sourcePath": "", "sourceUrl": ""}, {"id": 5, "title": "《TVB真的要和觀眾對著幹嗎？》", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-08-13", "created": "2026-08-13", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["tvb", "viutv"], "platformLabels": ["TVB", "ViuTV"], "platform": "TVB, ViuTV", "artist": "", "tags": ["TVB, ViuTV, 愛回家, 三代同糖, 電視批評"], "preview": "《愛回家之開心速遞》陪伴香港觀眾七年，終於在2026年8月迎來大結局。熊家故事告一段落之際，TVB隨即推出全新處境劇《愛回家之三代同糖》接棒，由車婉婉、吳若希、李茵彤飾演祖孫三代。觀眾期待的是延續《開心速遞》的溫馨搞笑風格，結果換來的卻是一...", "content": "<p>《愛回家之開心速遞》陪伴香港觀眾七年，終於在2026年8月迎來大結局。熊家故事告一段落之際，TVB隨即推出全新處境劇《愛回家之三代同糖》接棒，由車婉婉、吳若希、李茵彤飾演祖孫三代。觀眾期待的是延續《開心速遞》的溫馨搞笑風格，結果換來的卻是一面倒負評——有人形容「睇咗30秒，熄電視，還我愛回家」，更有人批評節奏似正劇、失去處境劇應有的輕鬆感。</p>\n<p>新劇最受爭議的，是女主角吳若希的演出。被網民狠批演技浮誇、生硬，聲線嘈吵，更有觀眾將她與《開心速遞》中林淑敏飾演的「大小姐」作比較，認為有模仿之嫌但效果欠佳。「有冇人覺得吳若希喺PPD版嘅大小姐，反而有種師奶嘅感覺」——這句評語或許誇張，卻反映觀眾對新舊交接的失落感。</p>\n<p>然而，新劇質素問題只是TVB病灶的冰山一角。近年TVB的編排策略更令觀眾摸不著頭腦：晚上9:30黃金時段，竟然播放廣告贊助的「健康探索」或「疾病科普」節目。試想觀眾辛苦一天，期望輕輕鬆鬆睇套處境喜劇，打開電視卻撞正不知名「專家」硬銷保健品——那份錯愕與反感不難想像。</p>\n<p>這種「趕客」操作，在競爭對比下顯得格外刺眼。當TVB在黃金時段塞入商業味過重的內容，觀眾自然用遙控器投票。</p>\n<p>結果不難預測：TVB觀眾持續流失，ViuTV收視屢創新高。ViuTV近年以本土製作路線站稳陣腳，節目風格貼地，慢慢吸納了一批不想再看慣性收視的觀眾。當TVB繼續與觀眾期待背道而馳，ViuTV便成為那個「願意聆聽觀眾」的選擇。</p>\n<p>說到底，電視台與觀眾的關係建基於信任。觀眾願意每晚準時打開電視，是一種習慣，也是一種情感連結。當這種連結被一再忽略——無論是強行植入的廣告、令人尷尬的新嘗試、還是無視觀眾聲音的編排——觀眾的選擇很簡單：不再睇。</p>\n<p>TVB要問的不是「觀眾為何對著幹」，而是「我們做了什麼讓觀眾選擇離開」。七年《愛回家》的結束，或许是一個時代的終結，但也可以是一個反思的起點。否則，下一個七年，TVB還剩下什麼？</p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-08-13-tvb-viutv.md"}, {"id": 6, "title": "【LOVE ATTACK】— Rescene啟示錄：當迷因先於音樂，細公司靠咩生存？", "contentType": "kpop", "contentTypeLabel": "K-Pop", "content_type": "kpop", "date": "2026-08-13", "created": "2026-08-13", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["instagram", "twitter", "threads", "tiktok"], "platformLabels": ["Instagram", "Twitter", "Threads", "TikTok"], "platform": "Instagram, Twitter, Threads, TikTok", "artist": "Rescene", "tags": ["Rescene, LOVE ATTACK, K-pop, 細公司, 迷因行銷, Melon冠軍"], "preview": "由一句「巨濟YAHO」說起 2024 年 8 月，Rescene 推出迷你專輯《SCENEDROME》，雙主打之一《LOVE ATTACK》正式發行。當時冇太多人注意。 兩年後嘅 2026 年 7 月 8 日，《LOVE ATTACK》登頂...", "content": "<h3>由一句「巨濟YAHO」說起</h3>\n<p>2024 年 8 月，Rescene 推出迷你專輯《SCENEDROME》，雙主打之一《LOVE ATTACK》正式發行。當時冇太多人注意。</p>\n<p>兩年後嘅 2026 年 7 月 8 日，《LOVE ATTACK》登頂韓國最大音樂平台 Melon 即時冠軍。</p>\n<p>呢個係 2024 年嘅舊歌。呢個係嚟自小型經紀公司 The Muze Entertainment 嘅女團，唔係 Big 4。</p>\n<p>改變一切嘅，唔係音樂，而係一句慶尚道方言。</p>\n<hr>\n<h3>巨濟 YAHO 係點爆發嘅？</h3>\n<p>2026 年春天，Rescene 隊長 Woni 持續靠自己 YouTube 頻道，帶住成員周圍拍片。喺某一條片入面，印尼裔日籍成員 Minami 用慶尚道方言配合誇張語氣大喊「<strong>거제 야호</strong>」（巨濟 YAHO），配上無偶像包袱嘅即興反應——片段喺韓國短影音平台瘋傳。</p>\n<p>然後韓國網民發現：咦，呢班係邊個？</p>\n<hr>\n<h3>先有迷因，先有粉絲，音樂最後先到</h3>\n<p>呢個係 Rescene 故事最有趣嘅地方。佢哋嘅成功唔係 typical K-pop 公式——唔係「公司大灑金錢 → MV millions views → 上節目谷人氣」。佢哋係：</p>\n<ol>\n<li><strong>先有內容</strong> → Woni 靠自己頻道累積一小群忠實觀眾</li>\n<li><strong>再有迷因</strong> → 「巨濟 YAHO」係自然散播，唔係買嘅</li>\n<li><strong>再有好奇</strong> → 幾百萬新粉絲湧入 discography</li>\n<li><strong>發現正嘢</strong> → 「吓，首歌原來好好聽？」</li>\n<li><strong>然後奇蹟出現</strong> → 2024 年嘅歌，2026 年先爆上冠軍</li>\n</ol>\n<p>呢個順序顛覆咗傳統 K-pop 工業邏輯。</p>\n<hr>\n<h3>《LOVE ATTACK》係一首咩嘢嘅歌？</h3>\n<p>如果你仲未聽過，咁就錯過咗呢個時代其中一首最被低估嘅女團作品。</p>\n<p>《LOVE ATTACK》係一首 groovy 愛情流行曲，副歌「Like me, like me / 아주 눈이 부신 너를 숨김없이 보여줘」（把我閃耀的你，毫無保留地展現）係關於自信——唔係嗰種「我好叻」嘅自大，而係「我終於敢於做自己」嘅那種。</p>\n<p>難怪粉絲形容佢「groovy love song + dreamy reminder of the magic that unfolds when we're confident in who we are」。</p>\n<hr>\n<h3>Gfriend 對比：十年前與今天的分別</h3>\n<p>十年前 Gfriend 靠 MV / Dance Practice 片段喺 YouTube 瘋傳，最後令「Rough」喺音樂節目逆襲——但嗰時嘅片段係<strong>官方精心製作</strong>嘅內容，只係散播渠道估咗。</p>\n<p>Rescene 更加極端：Woni 拍片唔係為咗谷宣傳，只係日常 content，Minami 嗰句「巨濟 YAHO」根本係<strong>即興反應</strong>，連公司都預計唔到。</p>\n<p>兩個案例都係「短片觸發」但本質唔同：Gfriend 係<strong>準備好嘅內容遇上啱嘅渠道</strong>，Rescene 係<strong>即興內容直接穿越所有工業關卡</strong>。</p>\n<hr>\n<h3>K-pop 市場嘅結構分歧</h3>\n<p>Rescene 嘅出現，令業界需要正視一個根本問題：<strong>而家 K-pop 市場已經出現結構性分歧</strong>。</p>\n<p><strong>大公司嘅生存模式</strong>：靠精密嘅市場營銷——天價 MV、偶像包袱嘅綜藝曝光、跨品牌聯乘、粉丝见面会全套流水線。呢套嘢有效，但係<strong>入場費極高</strong>，而且一旦市場情緒轉向，好難即時轉身。</p>\n<p><strong>細公司嘅生存之道</strong>：只剩一條路——<strong>製作好作品，等待知音人</strong>。</p>\n<p>Rescene 係最佳例證：佢哋冇錢谷 MV，但 Woni 靠自己一台相機累積 content；佢哋冇跨國代言，但 Minami 嘅即興反應成為韓國網民嘅集體記憶；佢哋甚至冇喺 2024 年上到任何一個重要一位——但當《LOVE ATTACK》沉寂兩年終於被听眾發現，佢嘅質素撐得住突如其來嘅幾百萬新粉絲。</p>\n<p>呢個係一個殘酷嘅概率遊戲：Big 4 女團可能出道一年已經有十個一位，細公司女團可能要等兩年先等到一個 meme。但 Rescene 證明咗一件事——<strong>如果作品係咁上下，遲到總好過冇到</strong>。</p>\n<hr>\n<h3>一個悲哀，一個進化</h3>\n<p>如果用 K-pop 舊標準嚟睇 Rescene，會覺得悲哀：出道兩年都唔溫唔火，要靠一個慶尚道方言 meme 先至有知名度，仲要係 2024 年嘅舊歌先上到冠軍——呢個工業究竟點解會咁？</p>\n<p>但如果用新標準嚟睇，佢代表嘅係進化：</p>\n<ul>\n<li><strong>粉絲不再被動接收公司設定嘅明星形象</strong>，而係自己喺 content 入面發現呢班女仔係幾咁真實</li>\n<li><strong>音樂本身先係終點</strong>，唔係起點——當大量新粉絲湧入 discography，佢哋真係留低咗，係因為首歌值得</li>\n<li><strong>小型公司終於有生存空間</strong>，唔再需要同 Big 4 鬥燒錢，只需一個人、一台相機、一句有感染力嘅口頭禪</li>\n</ul>\n<hr>\n<h3>終極啟示</h3>\n<p>當你以為 K-pop 已經被歐美製作人同大型 MV budget 支配晒，總有人用最 raw 嘅方式提醒你——<strong>真實，有時比精致更有穿透力</strong>。</p>\n<p>但呢個故事仲有另一半：<strong>真實需要作品撐腰</strong>。如果《LOVE ATTACK》係一首仆街歌，就算有一百個「巨濟 YAHO」都唔會有人記得佢哋。</p>\n<p>所以，Big 4 繼續用市場營銷定義K-pop；細公司繼續用好作品等待奇蹟。</p>\n<p>呢個係而家嘅遊戲規則。Rescene 只係証明咗——<strong>規則冇話你一定輸</strong>。</p>\n<hr>", "cover": "", "sourcePath": "", "sourceUrl": ""}, {"id": 7, "title": "《非份之罪》— 全套完食：短打制贏晒，但主線 tie-up 失守", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-07-22", "created": "2026-07-22", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["tvb"], "platformLabels": ["TVB"], "platform": "TVB", "artist": "", "tags": ["TVB, 非份之罪, 劇評, 結局, 2026, 續篇"], "preview": "12 日前我寫咗頭 8 集 impression，畀 7.5/10。今日全套播完， 係時候交 final verdict 。 ✅ 短打單元制 (6 unit × 4 集) 意外地 work ✅ 題材夠 dark 夠 gritty — TVB...", "content": "<p>12 日前我寫咗頭 8 集 impression，畀 7.5/10。今日全套播完，<strong>係時候交 final verdict</strong>。</p>\n<ul>\n<li>✅ 短打單元制 (6 unit × 4 集) 意外地 work</li>\n<li>✅ 題材夠 dark 夠 gritty — TVB 少見</li>\n<li>✅ 游嘉欣揹重飛，吳啟華終於識做</li>\n<li>⚠️ 主線穿插偶爾突兀</li>\n</ul>\n<p>呢 4 點有 3 點仲 stand，但<strong>第 4 點到結局發酵成更大嘅問題</strong>。</p>\n<p>直接落重點 — <strong>6 個 unit 入面有 3 個係 anthology 級數，2 個中規中矩，1 個失色</strong>。</p>\n<p><strong>神級 (anthology 級)：</strong><br>\n- <strong>石棺禁戀</strong> — 痴情 + 禁戀 + 悲劇，TVB 處理呢類題材少見咁成熟<br>\n- <strong>一億殺機</strong> — 爭產 + 人性貪婪，貼地到爆；貝安琪外籍太太身份伏線用到盡<br>\n- <strong>少女墮樓</strong> — 校園 + 網絡欺凌，游嘉欣交到戲</p>\n<p><strong>中規中矩：</strong><br>\n- 危險遊戲 — 題材新但 execution 未算 breakthrough<br>\n- 升級遊戲 — AI + 人性博弈嘅 concept 吸引，但 execution 半熟，cliché 嘅「機械人反轉」收尾拖低成個 unit</p>\n<p><strong>失色：</strong><br>\n- 斷捨離 — 環保 + 棄老題材本身敏感，但 execution 偏說教，beige tone 蓋過咗對白嘅衝擊力；陳煒 solo 撐住成個 unit，但節奏慢 + 衝突溫和，最致命係用 statistical 數字扮 dramatic — 觀眾早就 expected，結果反而顯得 cheap</p>\n<p>呢度要再畀返個 credit TVB：6 個 unit 入面有 3 個神級，<strong>呢個 hit rate 係 anthology series 入面好高嘅比例</strong>。</p>\n<p>呢條主線上次話 keep 住穿插，每次 unit 結尾 hint — 一開始覺得有懸念，到中段覺得有 potential，到結局⋯⋯</p>\n<p><strong>我嘅觀感：</strong><br>\n- Twist 本身 OK，但<strong>raise 多過 payoff</strong> — 結局 raise 咗新問題多過 answer<br>\n- 母女關係最後一幕 emotional 係 OK，但 logic 上有窿<br>\n- 結局 unit 同主線 tie-up 唔夠 clean — 有種「為咗要結局所以結局」嘅感覺</p>\n<p>呢個係成套劇最大嘅遺憾 — <strong>unit 寫得神，但主線 tie-up 弱</strong>。</p>\n<p>結局段拉咗 23-25 共 3 集，主線收埋 + 最終 unit 同步收尾。我嘅觀感：</p>\n<p><strong>最後 3 集 (23-25) 觀感：</strong><br>\n- <strong>結局大集 (25 集)</strong> 本身 OK，但 high note 配 low note 落差大。母女主線 reveal 後嘅 emotional 收尾有 hit，但 logic chain 同 motivation 唔及格 — 觀眾要 hard-sell 自己接受個身份反轉<br>\n- <strong>結局段尾段 (24-25 銜接位)</strong> 同主線 tie-up 嘅 montage 剪接太趕，感覺「為咗要結局所以 cut 落嚟」— 呢個係全集最 timetable-pressured 嘅一段<br>\n- 相對嘅，《<strong>石棺禁戀</strong>》嘅 one-shot reflection 同主線 tie 得 organic — 唯一一個 unit 做到雙線交集，呢個對比令結局段睇起嚟更 disappoint</p>\n<p><strong>結局 high note 定 low note 落幕？</strong><br>\n- 大結局選咗 low note 落幕 (女兒 reveal 身份後情緒崩潰) — 主題上 OK，但 execution 上 force 咗觀眾接受個 logic gap<br>\n- 如果 TVB 肯犧牲最後 10 分鐘做 tie-up reflection 而唔係 push dramatic reveal，呢套劇結局評分應該可以高 1 分</p>\n<p>selected unit impression 仲 OK（《石棺禁戀》嘅 case 反轉 + 《一億殺機》最後一鏡仍然有 anthology level），所以 score 唔跌穿 7。</p>\n<p>由上次 7.5 跌到 <strong>7.0</strong> — 主線 tie-up 失守係主因。</p>\n<p><strong>Pros:</strong><br>\n- ✅ 短打制依然係 TVB 神操作<br>\n- ✅ unit 質素高 (尤其石棺禁戀 + 一億殺機 + 少女墮樓)<br>\n- ✅ 游嘉欣全程 carry 到 — 整套劇真係靠佢一個人扛<br>\n- ✅ 題材 dark + gritty，係 TVB 少見嘅成人向嘗試</p>\n<p><strong>Cons:</strong><br>\n- ⚠️ 主線 raise 多過 payoff — 最大敗筆<br>\n- ⚠️ 中後段 unit 質素參差 — 1-2 個 routine<br>\n- ⚠️ 結局 tie-up 未夠 clean</p>\n<p><strong>推薦對象：</strong><br>\n- 鍾意短打 anthology (《Black Mirror》、《True Detective》路線) → 必睇，呢套係 TVB 罕見接近呢個 level 嘅作品<br>\n- 鍾意 closed-loop 主線 (《白色強人》、《新聞女王》路線) → 7.0 都嫌多<br>\n- 想知 twist → 可 skip 中段 unit，直接由結局 unit 入手已經夠</p>\n<hr>\n<p>呢個係 industry insight — TVB 多年嚟嘅主線劇 (《白色強人》、《新聞女王》) 強在 case-by-case + 角色發展，但<strong>主線 closed-loop 一直係弱項</strong>。</p>\n<p>《非份之罪》嘅做法聰明：unit case 商業、主線懸念 keep 觀眾追。但代價係 unit 同主線 tie-up 唔夠 organic。</p>\n<p>外國 anthology (《Black Mirror》、《True Detective》season 1、《Fargo》每季獨立) 處理得更好嘅地方係：unit 同主題 tie 得 organic 一啲 — 主線 raise 嘅問題 unit 入面有 partial answer，而唔係 raise 完擺到結局先解。</p>\n<p><strong>TVB 如果想再玩短打制，建議：</strong><br>\n- 主線 ratio 由 30% → 15% (更 light touch)<br>\n- Unit ratio 70% → 85% (更 pure)<br>\n- 主線 twist 改為 <strong>within-unit thematic reflection</strong>，唔好再 cross-unit closed loop</p>\n<p>呢套劇嘅實驗係成功嘅 — <strong>TVB 證明咗短打制喺香港 work</strong>，下次再玩應該可以更 pure。</p>\n<hr>\n<p><strong>Score update：7.0/10</strong> (downgrade from 7.5)</p>\n<p>追咗嘅朋友：keep 住追到尾 — unit 仍然值得；未睇嘅：由 unit 1 (少女墮樓) 開始 — 因為主線 skip 咗都唔會 lost。</p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-07-22-非份之罪續篇.md"}, {"id": 8, "title": "《非份之罪》— TVB 短打單元制玩出個新天，仲要夠 dark", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-07-10", "created": "2026-07-10", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["tvb"], "platformLabels": ["TVB"], "platform": "TVB", "artist": "", "tags": ["TVB, 非份之罪, 劇評, Deadly Sins, 吳啟華, 游嘉欣, 2026"], "preview": "TVB 終於肯玩人性黑暗面，仲要係改編真人真事 — 王心慰監製、6 大單元 (少女墮樓、無臉女屍、石棺禁戀、一億殺機、危險遊戲⋯) — 一套 TVB 罕見咁 gritty 嘅懸疑劇。 呢度要畀返個 credit TVB。25 集塞 6 單元...", "content": "<p>TVB 終於肯玩人性黑暗面，仲要係改編真人真事 — 王心慰監製、6 大單元 (少女墮樓、無臉女屍、石棺禁戀、一億殺機、危險遊戲⋯) — 一套 TVB 罕見咁 gritty 嘅懸疑劇。</p>\n<p>呢度要畀返個 credit TVB。25 集塞 6 單元 (每單元 4 集) 嘅做法，<strong>本來係 TVB budget 緊嘅妥協</strong> — 但效果出奇地 work：</p>\n<ul>\n<li><strong>節奏快</strong>：每集都係完整推進，唔會有《白色強人》嗰種「又係會議室吹水」嘅窒礙感</li>\n<li><strong>單元獨立睇得明</strong>：就算你 skip 咗上一個 unit，下一個 unit 都接得到 (呢點對新觀眾好重要)</li>\n<li><strong>gritty 題材更入肉</strong>：石棺禁戀、一億殺機呢類重口味，4 集做完反而有種「氣都未抖得切」嘅張力</li>\n<li><strong>主線穿插得巧</strong>：母女冇身份證嘅秘密做主線，每次 unit 結尾輕輕 hint — 唔搶 unit 戲，但 keep 到懸念</li>\n</ul>\n<p>Netflix / ViuTV 嘅 6 集慢煮式懸疑 (例如《乜嘢特工》)，有時會為咗「文青」而拖；TVB 呢個短打制反而<strong>商業 + quality 平衡得幾好</strong>。</p>\n<ul>\n<li><strong>石棺禁戀</strong> — 痴情 + 禁戀 + 極端悲劇，TVB 少見咁 dark 嘅處理</li>\n<li><strong>一億殺機</strong> — 爭產 + 人性貪婪，貼地到爆 (貝安琪外籍太太身份係伏線)</li>\n<li><strong>少女墮樓</strong> — 校園 + 網絡欺凌，游嘉欣交到戲</li>\n</ul>\n<p>每個 unit 都係獨立嘅 short thriller，加埋 6 個 = 一套<strong>短打 anthology series</strong>。TVB 之前試過《跳躍生命線》呢類多線並行，呢次係第一次有咁強嘅「短打感」。</p>\n<p>不得不提游嘉欣。<strong>呢套劇係佢嘅個人 show</strong>。由細女兒到石棺禁戀被施暴、被救贖、被背叛，佢嘅情緒 range 撐到成套劇。TVB 一線花旦呢幾年走晒，<strong>游嘉欣係少數仲可以扛收視嘅女演員</strong>。</p>\n<p>吳啟華做 control 狂父親，外鬆內緊，contrast 貝安琪 (外籍太太) 嘅 sweet 演繹 — 呢對夫妻線係主線最搶眼嘅位。戴祖儀做反叛大女，終於唔係花瓶，係有層次嘅角色。</p>\n<p>曾展望演好色渣男向游嘉欣施暴獲讚 — OK 啦，徐榮演腦痙攣拍到頸抽筋 — 專業，呢啲都係<strong>單元 case 嘅綠葉</strong>。真正能 carry 整套劇嘅，主線就係游嘉欣 + 吳啟華。</p>\n<p>睇完頭 8 集，我嘅結論係：</p>\n<ul>\n<li>✅ 監製王心慰 quality 喺度</li>\n<li>✅ 短打單元制神操作 — 6 unit × 4 集 嘅結構意外地 work</li>\n<li>✅ 題材夠 dark 夠 gritty，係 TVB 少見</li>\n<li>✅ 演員交足貨，游嘉欣 + 吳啟華 係主線靈魂</li>\n<li>⚠️ 唯一 nitpick：中段 unit 與 unit 間嘅主線穿插偶爾會 feel 突兀 (但唔算硬傷)</li>\n</ul>\n<p><strong>7.5/10</strong> — 係 TVB 近 2 年最值得追嘅劇之一。唔係神劇，但係一套<strong>有野心、有 execution、有人味</strong>嘅懸疑 anthology。</p>\n<p>追咗嘅朋友 keep 住追；未睇嘅可以由頭開始 — 因為每個 unit 獨立睇都 work。</p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-07-10-非份之罪.md"}, {"id": 9, "title": "《飛常日誌II》— 當行業劇變成機管局贊助商宣傳冊", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-06-17", "created": "2026-06-17", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["tvb"], "platformLabels": ["TVB"], "platform": "TVB", "artist": "", "tags": ["TVB, 飛常日誌II, 劇評, 馬國明, 高海寧, 2026"], "preview": "睇完頭兩集，我個感覺係 — 我唔係觀眾，我係被推銷嘅對象。 TVB 一向自詡「行業劇王」，《衝上雲霄》、《白色強人》、《星空下的仁醫》，都係用真實行業做舞台再加 drama。冇 industry 冇 conflict，淨係有新聞稿。 但《飛...", "content": "<p>睇完頭兩集，我個感覺係 — 我唔係觀眾，我係被推銷嘅對象。</p>\n<p>TVB 一向自詡「行業劇王」，《衝上雲霄》、《白色強人》、《星空下的仁醫》，都係用真實行業做舞台再加 drama。冇 industry 冇 conflict，淨係有新聞稿。</p>\n<p><strong>但《飛常日誌II》走錯晒方向。</strong></p>\n<p>睇個官方 synopsis 就知：第 2 集講「香港國際機場繁忙運轉，突遇全球系統故障而出現混亂⋯各部門迅速應變」。咦，我係咪睇緊機管局年報？定新聞處公關稿？</p>\n<p>我冇見過一套劇嘅官方簡介可以咁完美咁迴避咗「邊個角色有咩 drama」呢個基本問題。冇衝突、冇懸念、冇人性掙扎 — 淨係有「各部門迅速應變」六隻字。呢個唔係劇情，呢個係 closing remark。</p>\n<p><strong>問題喺邊？</strong></p>\n<p>估唔到第二輯比第一輯更嚴重。成個感覺好似 — 機管局 buy 咗個時段，將劇集當緊宣傳渠道用。馬國明做機場高管但「人」嘅部分欠奉；高海寧、劉穎鏟、周嘉洛一班演員淪為「各部門代表」嘅功能性角色，唔係有血有肉嘅人物。</p>\n<p>導演陳耀全（上一套《星空下的仁醫》）功架應該有嘅，但受限於個劇本，佢都冇乜嘢發揮。</p>\n<p><strong>TVB 行業劇傳統去咗邊？</strong></p>\n<p>《衝上雲霄》講空中少爺都仲有三角戀同身份懸殊嘅 drama；《白色強人》講醫管局都有政治鬥爭同道德兩難。到咗《飛常日誌II》⋯我哋得返「各部門迅速應變」。</p>\n<p>呢個唔係行業劇，呢個係贊助商植入式文宣。</p>\n<p>想知香港機場點運作，睇機管局官網仲實際。<br>\n想睇 drama，睇 Netflix。<br>\n《飛常日誌II》兩頭唔到岸 — 唔夠宣傳、唔夠劇。</p>\n<p>TVB，係時候問返自己：你做緊行業劇，定做緊客戶贊助商嘅 demo reel？</p>\n<hr>\n<p><em>資料來源：myTV SUPER 官方節目簡介、TVB 2026 年中節目巡禮（2026年6月）</em></p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-06-17-飛常日誌II.md"}, {"id": 10, "title": "《愛·回家之三代同糖》— 全女班三大亮點", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-06-13", "created": "2026-06-13", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["tvb"], "platformLabels": ["TVB"], "platform": "TVB", "artist": "", "tags": ["TVB, 處境劇, 愛回家, 三代同糖, 車婉婉, 吳若希"], "preview": "2026年8月，TVB全新處境劇《愛·回家之三代同糖》將接棒《開心速遞》。這套被稱為「三代同糖」既新劇，究竟有咩可以期待？ 一個關於「覺醒」同「三代衝突」既故事—— 車婉婉 飾 「唐曹嘉冰」 投入大半生相夫教子，突然「覺醒」，由加拿大飛返香...", "content": "<p>2026年8月，TVB全新處境劇《愛·回家之三代同糖》將接棒《開心速遞》。這套被稱為「三代同糖」既新劇，究竟有咩可以期待？</p>\n<p>一個關於「覺醒」同「三代衝突」既故事——</p>\n<h3>車婉婉 飾 「唐曹嘉冰」</h3>\n<p>投入大半生相夫教子，突然「覺醒」，由加拿大飛返香港「搵返自己」。同女兒鬧翻多年，因為外孫女先「覺醒」。</p>\n<h3>吳若希 飾 「唐萬里 / Lesley」</h3>\n<p>鋼鐵中女，未婚產子。事業得意，但屋企KPI全部撻Q。</p>\n<h3>李茵彤 飾 「唐芯」</h3>\n<p>佛系GEN Z，三分鐘熱度，在外婆+媽咪之間優雅求存。</p>\n<hr>\n<h3>車婉婉</h3>\n<ul>\n<li>1992年新秀歌唱大賽冠軍出道</li>\n<li>歌手 + 演員身份</li>\n<li>之前演過《八時入席》(2016)、《大醬園》(2020)</li>\n<li><strong>第一次擔正處境劇女一</strong></li>\n</ul>\n<h3>吳若希</h3>\n<ul>\n<li>2010年出道，專輯《戀愛日記》</li>\n<li>「洗腦天后」稱號</li>\n<li>2015年憑《武則天》片尾曲《眼淚的秘密》爆紅</li>\n<li>連續兩年勁歌金曲金獎</li>\n<li><strong>第一次演單親媽咪角色</strong></li>\n</ul>\n<h3>李茵彤 (Desta)</h3>\n<ul>\n<li>聲夢歌手新人</li>\n<li>憑《唱錢》遊戲節目人氣急升</li>\n<li>入行兩年光速上位</li>\n<li><strong>第一次做處境劇女主角</strong></li>\n</ul>\n<hr>\n<h3>✅ 大讚既：</h3>\n<ul>\n<li>「車婉婉做外婆好有驚喜，唱功又好」</li>\n<li>「吳若希演單親媽咪應該好有發揮空間」</li>\n<li>「睇《唱錢》覺得佢好有靈氣，演Gen Z應該好入戲」</li>\n</ul>\n<h3>❌ 擔心既：</h3>\n<ul>\n<li>「新人擔正，得唔到？」</li>\n<li>「舊人全部唔參演，變咗另一套劇」</li>\n<li>「三代同糖個名……到底想講乜？」</li>\n</ul>\n<hr>\n<p>據滕麗名講：「應該冇我份。」</p>\n<p>原因得一個——<strong>慳錢</strong>。</p>\n<p>《開心速遞》舊陣營：<br>\n- 呂慧儀、滕麗名、林淑敏、許家傑<br>\n- 做咗多年，人工已經唔平</p>\n<p>TVB寧願用全新人班：<br>\n- 慳人工<br>\n- 可以話係「轉型」<br>\n- 包裝成「女性覺醒」新方向</p>\n<p>呢個就係TVB既商業邏輯。</p>\n<hr>\n<p><strong>★★★☆☆</strong></p>\n<h3>亮點：</h3>\n<ul>\n<li>女性覺醒題材——貼近年輕觀眾</li>\n<li>AI衝擊/時事——追上潮流</li>\n<li>三代同堂——親情倫理</li>\n<li>車婉婉第一次擔正</li>\n</ul>\n<h3>問題：</h3>\n<ul>\n<li>舊人全部消失——老粉絲流失</li>\n<li>新人李茵彤——未有代表作</li>\n<li>「三代同糖」個名——網民話唔明</li>\n</ul>\n<p>值得期待，但《開心速遞》既味道……應該唔會再有。</p>\n<hr>\n<p><em>資料來源：TOPick、晴報、劇照（2026年6月）</em></p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-06-13-sandai_tongtin_review.md"}, {"id": 11, "title": "《優雅的新娘》— 韓劇復仇路", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-05-18", "created": "2026-05-18", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["tvb_plus"], "platformLabels": ["TVB Plus"], "platform": "TVB Plus", "artist": "", "tags": ["韓劇, 復仇, 家庭, 婚嫁, TVB Plus"], "preview": "女主角為咗尋找親生母親，不惜以婚姻作為復仇工具，嫁入仇人屋企——典型韓式復仇劇公式，但演員夠班，捱得過開頭幾集就會上癮。 項目 內容 原名 태풍의 신부（Vengeance of the Bride） 頻道 TVB Plus 黃金時段 播出...", "content": "<blockquote>\n<p><strong>女主角為咗尋找親生母親，不惜以婚姻作為復仇工具，嫁入仇人屋企——典型韓式復仇劇公式，但演員夠班，捱得過開頭幾集就會上癮。</strong></p>\n</blockquote>\n<hr>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目</th>\n<th>內容</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>原名</td>\n<td>태풍의 신부（Vengeance of the Bride）</td>\n</tr>\n<tr>\n<td>頻道</td>\n<td>TVB Plus 黃金時段</td>\n</tr>\n<tr>\n<td>播出時間</td>\n<td>2026年5月（韓國2022年已播出）</td>\n</tr>\n<tr>\n<td>類型</td>\n<td>日日連續劇</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n<ul>\n<li><strong>朴荷娜</strong> 飾演 女主角</li>\n<li><strong>孫暎敏</strong>、<strong>姜志燮</strong>、<strong>朴胤載</strong> 主演</li>\n<li><strong>吳丞芽</strong> 助陣</li>\n</ul>\n<hr>\n<p>典型嘅韓式復仇劇套路，但係勝在：</p>\n<ol>\n<li><strong>節奏明快</strong> — 一集一個爆點，唔會拖</li>\n<li><strong>情感夠濃</strong> — 母女情、夫妻情、婆媳關係，全部劍拔弩張</li>\n<li><strong>演員夠晒班</strong> — 呢套演員全部都係實力派，做起上嚟好有說服力</li>\n</ol>\n<p>不過如果睇得多呢類型嘅話，你可能覺得有啲老土——悲慘女主角、豪門恩怨、復仇結婚，基本上係冇新意。但係當下飯嘢睇又幾好㗎喎！</p>\n<hr>\n<ul>\n<li>✅ 鐘意復仇劇</li>\n<li>✅ 鍾意睇婆媽大戰</li>\n<li>✅ 想搵下飯嘅輕鬆煲劇</li>\n<li>❌ 已經睇厭呢類型嘅可以跳過</li>\n</ul>\n<hr>\n<p><em>📺 TVB Plus 播出中，逢星期一、二、四、五晚10:30</em></p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-05-18-優雅的新娘.md"}, {"id": 12, "title": "《21世紀大君夫人》— 收視冠軍與負評如潮的奇異共存", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-05-16", "created": "2026-05-16", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["mbc", "disney_plus"], "platformLabels": ["MBC", "Disney+"], "platform": "MBC, Disney+", "artist": "", "tags": ["韓劇, 收視分析, IU, 邊佑錫, 21世紀大君夫人"], "preview": "觀眾用遙控器投票，收視率高達 12.7%；評論家用鍵盤鬧爆，負評潮水般湧來——呢套劇做到咁多年都未見過嘅「人愈鬧愈紅」奇景。 項目 內容 頻道 MBC 金土劇 播出時間 2026.4.10-5.16 集數 12 集 平台 Disney+ 同...", "content": "<blockquote>\n<p><strong>觀眾用遙控器投票，收視率高達 12.7%；評論家用鍵盤鬧爆，負評潮水般湧來——呢套劇做到咁多年都未見過嘅「人愈鬧愈紅」奇景。</strong></p>\n</blockquote>\n<hr>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目</th>\n<th>內容</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>頻道</td>\n<td>MBC 金土劇</td>\n</tr>\n<tr>\n<td>播出時間</td>\n<td>2026.4.10-5.16</td>\n</tr>\n<tr>\n<td>集數</td>\n<td>12 集</td>\n</tr>\n<tr>\n<td>平台</td>\n<td>Disney+ 同步</td>\n</tr>\n<tr>\n<td>卡士</td>\n<td>IU、邊佑錫、魯尚炫、孔升妍</td>\n</tr>\n<tr>\n<td>收視走勢</td>\n<td>7.8% → 9.5% → 11.2% → 12.7%</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n<h3>邊佑錫：「善宰」變「木頭大君」</h3>\n<p>邊佑錫 2024 年靠《背著善宰跑》爆紅，溫柔深情形象深入民心。但今次套入「理安大君」呢個角色——一個必須收埋野心、斂其鋒芒的王族——問題就出現：</p>\n<ul>\n<li>表情僵化 ✅</li>\n<li>台詞含糊 ✅</li>\n<li>情緒轉換生硬 ✅</li>\n</ul>\n<p>深情善宰係 outward outward outward，但理安大君係 inward inward inward。同一套演技風格，撞上完全相反嘅角色設定，就變成「零共鳴木頭人」。韓媒好寸咁形容：<strong>「由善宰變成木頭大君」</strong>。</p>\n<h3>IU：用力過猛定係精準拿捏？</h3>\n<p>IU 評價兩極就複雜得多：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>支持派</th>\n<th>反對派</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>演活財閥野心與瘋感</td>\n<td>演得太用力，浮誇</td>\n</tr>\n<tr>\n<td>毒舌霸氣有新突破</td>\n<td>「表演感」太重</td>\n</tr>\n<tr>\n<td>眼神有戲，游刃有餘</td>\n<td>無法代入</td>\n</tr>\n</tbody>\n</table></div>\n<p>關鍵喺：IU 喺《我的大叔》、《苦盡柑來遇見你》都係收住做、內斂派。今次要做霸道 CEO——風格完全反轉，部分粉絲唔習慣佢咁「放」。</p>\n<hr>\n<h3>被鬧爆嘅位</h3>\n<ol>\n<li><strong>公式化</strong>：「契約婚姻」呢個設定用咗起碼 20 年，唔少網民已經厭咗</li>\n<li><strong>懸浮設定</strong>：比《宮》（2006）更離地，被狠批「對天龍人煩惱無興趣」</li>\n<li><strong>價值觀問題</strong>：君主立憲設定被話「落後腐朽封建」，微商女總裁 + 古裝男模 cosplay</li>\n<li><strong>最爆負評</strong>：<strong>「似係將以往神劇餵咗俾 AI 之後產出嘅過期糞」</strong></li>\n</ol>\n<h3>收視起飛嘅位</h3>\n<ol>\n<li><strong>快節奏</strong>：第二集就直球求婚，「隔牆吻」、「遊艇救美」場景收視爆升</li>\n<li><strong>顏值擔當</strong>：邊佑錫冰塊盒腹肌 + IU 財閥造型，每一幀都係海報</li>\n<li><strong>解壓首選</strong>：定位係「下飯劇」，唔需要用腦，純粹睇靚人傾偈</li>\n</ol>\n<hr>\n<p>對比 2006 年《宮》點解成？</p>\n<p>當年尹恩惠係<strong>平凡高中女生</strong>，觀眾可以瞬間代入——嫁入王室呢個設定自帶「灰姑娘」反差。</p>\n<p>但《大君夫人》呢？</p>\n<p><strong>成熙周一開始就係 Castle 集團 CEO，財閥千金，贏在起跑線。</strong> 觀眾對佢「因為平民身份受挫」呢個痛苦根本共鳴唔到——你有幾千億身家，你愁咩？</p>\n<blockquote>\n<p><strong>簡單嚟講：唔係我嘅問題，係我唔理解你嘅問題。</strong></p>\n</blockquote>\n<hr>\n<p>呢套劇做到嘅，係精準嘅<strong>商業計算</strong>：<br>\n- 高顏值 CP ✅<br>\n- 甜場面密密來 ✅<br>\n- 唔需要思考 ✅<br>\n- OTT 平台同步 ✅</p>\n<p>但佢唔係為咗拎獎而拍，佢係為收視而拍。</p>\n<p><strong>收視冠軍 + 負評如潮，呢個矛盾唔係意外，係策略。</strong></p>\n<hr>\n<p><em>資料來源：風傳媒、Yahoo 新聞、Juksy、Korea Star Daily（2026年4-5月）</em></p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-05-16-21世紀大君夫人.md"}, {"id": 13, "title": "《愛·回家之開心速遞》— 香港最長壽處境劇的時代終結", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-05-15", "created": "2026-05-15", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["tvb"], "platformLabels": ["TVB"], "platform": "TVB", "artist": "", "tags": ["TVB, 處境劇, 香港電視, 愛回家, 行業分析"], "preview": "播出超過2,800集、橫跨近9年，《愛·回家之開心速遞》即將於今年7月迎來大結局。這不是一齣普通電視劇的結束，而是香港電視工業一種產品形態的終結信號。 TVB的處境劇向來以「穩定產出」見稱，但《開心速遞》的製作規模早已超越一般處境劇的定位。...", "content": "<p>播出超過2,800集、橫跨近9年，《愛·回家之開心速遞》即將於今年7月迎來大結局。這不是一齣普通電視劇的結束，而是香港電視工業一種產品形態的終結信號。</p>\n<p>TVB的處境劇向來以「穩定產出」見稱，但《開心速遞》的製作規模早已超越一般處境劇的定位。劇中連戲演員多達50至60人，主要演員效力多年後薪酬水漲船高，加上台前幕後的人力物力耗費，整體開支相當驚人。</p>\n<p>問題在於：這筆錢，賺得回來嗎？</p>\n<p>在大環境不景氣的情況下，就算廣告商仍然垂青，吸金力已較全盛時期大打折扣。報道指就算仍有贊助，都COVER唔到高昂製作成本。TVB在經濟效益的考量下，選擇讓這部「香港最長壽處境劇」以光榮引退方式收官。</p>\n<p>這是殘酷的商業邏輯。</p>\n<p>《愛·回家》當年成功，靠的是「廢青金城安」——一個游手好閒、沒有方向的年輕人，反映香港社會的迷茫與焦慮。這個角色設定精準踩中了時代情緒，讓觀眾產生共鳴。</p>\n<p>但9年後，金城安長大了。</p>\n<p>角色成長本是好事，但對處境劇而言，核心人設的改變意味著原有的觀眾粘合點消失。當「廢青」變成「打工仔」，當初追看的情感連結便隨之瓦解。更致命的是，幾組核心CP的離巢——包括「龔水戀」張景淳與呂慧儀、「蓮輝CP」林淑敏與許家傑——令劇集原本最強的配搭效應再難複製。</p>\n<p>網民的批評並不苛刻：「核心演員走晒，睇落去都冇意思」、「後期愈來愈荒謬老套」。這不是觀眾變了，是劇集原地踏步。</p>\n<p>如果說成本上漲和題材老化是慢性死亡，那麼「不賣內地」才是真正的致命傷。</p>\n<p>TVB今天的生存邏輯很簡單：必須靠內地市場變現。任何無法進入內地市場的產品，在TVB的框架裡都是「性價比低」的業務。</p>\n<p>問題在於，處境劇本質上是「本地產品」——廣東話對白、港式幽默、香港社會的細碎人情。這些元素對內地觀眾而言門檻極高：get唔到笑點、感受唔到人情味、沒有共鳴基礎。</p>\n<p>反觀TVB的其他節目——無論是時裝劇、古裝劇還是綜藝——起碼都有「進入內地市場」的可能性。但處境劇？太local了，local到根本沒有輸出價值。</p>\n<p>所以當TVB需要資源重配，處境劇就成為首先被優化的對象。不是因為它不夠好，而是因為它根本不符合TVB今天的商業模型。</p>\n<p>《愛·回家之開心速遞》的結局，映射的是整個香港電視工業的結構性轉變。當一個電視台的核心收入來源不再是本地觀眾，而是內地市場，那麼產品的取捨邏輯就會徹底改變。</p>\n<p>香港處境劇的黃金時代，建立在「本地觀眾支撐本地廣告」的模型之上。這個模型正在消亡。</p>\n<p>或許7月的大結局，不僅是一齣劇的終結，更是一個電視時代的終結儀式。</p>\n<hr>\n<p><em>資料來源：東方新地、Weekendhk、晴報（2026年5月）</em></p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-05-15-ai_home_review.md"}, {"id": 14, "title": "《魔音女團》— 笑話變認真，TVB 消費緊「魔音」呢個名", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-05-13", "created": "2026-05-13", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["tvb"], "platformLabels": ["TVB"], "platform": "TVB", "artist": "", "tags": ["TVB, 選秀, 偶像, 魔音女團, 真人騷"], "preview": "《魔音女團》五月初正式開播，十六位「練習生」接受陳奐仁、陳潔靈兩位「班主任」嘅訓練，最終六人出道——聽落好認真好專業。但問題嚟喇：節目名叫「魔音」，但佢想認真做 Idol。 喺香港網絡文化入面，「魔音」唔係乜嘢好嘢——代表走音、甩beat、...", "content": "<p>《魔音女團》五月初正式開播，十六位「練習生」接受陳奐仁、陳潔靈兩位「班主任」嘅訓練，最終六人出道——聽落好認真好專業。但問題嚟喇：節目名叫「魔音」，但佢想認真做 Idol。</p>\n<p>喺香港網絡文化入面，「魔音」唔係乜嘢好嘢——代表走音、甩beat、令人耳朵流產嗰種。當初 TVB 喺節目巡禮拎「魔音天團」出嚟，唔少人都當係另類搞笑節目。</p>\n<p>結果節目正式製作，完全走正統 Idol 訓練路線：唱跳Rap要、形象改造要、韓國偶像學院舞蹈訓練都要。四個核心口號「唱、跳、Rap、睇」——呢個係標準 K-Pop 公式，唔係乜嘢好笑嘅設定。</p>\n<p>唯一解釋就係：TVB 想借「魔音」呢個網絡笑話吸眼球，但節目內容完全係另一回事。</p>\n<p><strong>矛盾位：</strong><br>\n- 如果係正經 Idol 訓練 → 點解要用「魔音」呢個名？<br>\n- 如果係借笑話搞宣傳 → 做咩真係請老師、飛韓國、認真訓練？</p>\n<p><strong>兩個字：定位混亂。</strong></p>\n<p>觀眾 expectation 係「魔音」= 搞笑，但 actual 係睇佢哋點樣訓練。呢個 gap 令到節目有啲兩頭唔到岸。</p>\n<p>如果你問我：「真係一點都冇嘢好睇？」</p>\n<p>又唔係嘅。</p>\n<p>十六位練習生當中唔乏靚女——宋宛穎（前港姐冠軍）、倪樂琳、莊子璇等都係吸睛之選。佢哋嘅顏值同參賽故事本身已經有娛樂性。</p>\n<p>加上 Hanjin（陳奐仁）敢啀嘅作風——「唱極都唔中旋律」呢句說話喺花生友眼中係最大嘅睇頭。</p>\n<p>《魔音女團》最大問題唔係節目認真與否，而係<strong>個名同內容完全唔夾</strong>。TVB 消費「魔音」呢個網絡符號去呃流量，但節目本體係正經 Idol 訓練——兩樣嘢根本係平行時空。</p>\n<p>如果想認真做 Idol，唔該改個名。<br>\n如果想做笑話，就唔好請老師飛韓國。</p>\n<p>而家呢個樣——兩頭都唔著數。</p>\n<hr>\n<p><strong>評分：5.5/10</strong><br>\n<strong>賣點：</strong> 靚女夠多、Hanjin 敢啀<br>\n<strong>伏味：</strong> 定位矛盾、為流量用錯題目</p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-05-13-魔音女團.md"}, {"id": 15, "title": "《IT狗2.0》— 神劇回歸，等你四年", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-05-06", "created": "2026-05-06", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["viutv"], "platformLabels": ["ViuTV"], "platform": "ViuTV", "artist": "", "tags": ["ViuTV, IT狗, 科技, 劇評"], "preview": "時隔四年，《IT狗》終於推出續集《IT狗2.0》（In Geek We Trust 2.0），由 MakerVille 出品，2026年4月27日起逢星期一至五晚21:30 ViuTV 播出。 亮点 成功延續荒誕風格 — 第一季最叻既係笑中...", "content": "<p>時隔四年，《IT狗》終於推出續集《IT狗2.0》（In Geek We Trust 2.0），由 MakerVille 出品，2026年4月27日起逢星期一至五晚21:30 ViuTV 播出。</p>\n<h3>亮点</h3>\n<ol>\n<li><strong>成功延續荒誕風格</strong> — 第一季最叻既係笑中有sell，sell得自然，第二季keep到呢種「荒誕但貼地」既平衡，唔會話為咗搞笑而甩beat。</li>\n<li><strong>Jeffrey回歸呢鋪幾好</strong> — 第5集「零死角男神」魏浚笙（Jeffrey）飾演既Jayden驚喜現身，事隔4年強勢回歸引爆全城熱話，粉絲期待值拉滿！</li>\n<li><strong>議題夠貼題</strong> — 全面進軍NFT、元宇宙、Web3、人工智能(AI)等尖端科技領域，都係近年香港人關心既話題，唔係求其sell Technology。</li>\n<li><strong>MakerVille願意投資</strong> — 等咗4年先出第二季，唔似啲「一次性」劇集，願意投資做大佢，幾有誠意。</li>\n</ol>\n<h3>值得留意</h3>\n<ul>\n<li><strong>劇情承接</strong> — 第一季講創業，第二季講守業。導演簡君晉話：「第一季好明顯就係創業，第二季就係佢哋點樣守業。原來係咁難既。」呢個主題幾引起共鳴。</li>\n<li><strong>游學修爭議</strong> — 有傳劇集疑似影射「試當真」NFT事件，引發游學修公開批評但反被網民圍剿，最後要刪除Threads。話題性夠，有花生睇。</li>\n</ul>\n<h3>綜合</h3>\n<p>《IT狗2.0》算係近年ViuTV最具話題性既作品之一。如果你鍾意第一季荒誕既笑同sell technology既風格，第二季既係延續得好好既選擇。</p>\n<p><strong>推薦度：</strong> 🌕🌕🌕🌕🌑</p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-05-06-IT狗2.0.md"}, {"id": 16, "title": "《重案解密》— 老土，但老土得未夠狠", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-04-18", "created": "2026-04-18", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["iqiyi"], "platformLabels": ["優酷"], "platform": "優酷", "artist": "", "tags": ["港劇, 犯罪, 懸疑, 優酷, 評論"], "preview": "一套劇最大問題不是題材，而是定位。 《重案解密》打着「改編自香港真實奇案」的旗號，第一集交出的牌是：舊情、誤會、陳年懸案——經典到不能再經典的三寶。警長與女警因舊案反目，再被迫攜手辦案，呢個設定，我阿媽細個都睇過起碼三套。 問題不在演員，而...", "content": "<p>一套劇最大問題不是題材，而是定位。</p>\n<p>《重案解密》打着「改編自香港真實奇案」的旗號，第一集交出的牌是：舊情、誤會、陳年懸案——經典到不能再經典的三寶。警長與女警因舊案反目，再被迫攜手辦案，呢個設定，我阿媽細個都睇過
