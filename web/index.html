起碼三套。</p>\n<p>問題不在演員，而在角色。</p>\n<p>苗僑偉是正氣老手，岑麗香係新生代警花，兩個加埋本該係穩陣配置。但第一集呈現的化學反應，勉強叫做「各玩各的」——你見到演員做緊嘢，但見唔到角色嘅靈魂。洪永城同周家怡相對比較穩，但戲份所限，搶唔到幾多分鐘。</p>\n<p>老土唔係罪，但老土得太平庸就係問題。</p>\n<p>第一集喺處理「重啟懸案」呢個契機時，節奏偏向安全，冇話故意慢，但亦都冇令人想追睇第二集嘅鈎。你以為會有一個超級反轉、結局揭示——結果收收埋埋，留到最後先話你知有伏筆，但個伏筆又未夠吸引。</p>\n<p>最後可以拉去講平台方向。</p>\n<p>優酷港劇場最近密密試緊呢種「中港合拍」犯罪懸疑配方，《重案解密》同《正義女神》路線相似，但後者有佘詩曼林峯呢張皇牌，前者只能靠「真實個案」呢個標籤硬食。12集嘅篇幅，唔算長，但如果頭幾集建立唔到追看動力的話，後半段就好難谷上嚟。</p>\n<p>結論：你當然可以繼續追——但期望值建議放喺「及格」水平，唔好諗住一嚟就係《踩過界》或《EU超時任務嗰種格局。</p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-04-18-重案解密.md"}, {"id": 17, "title": "【FLOWERING】— 七年沉澱，終於為自己而開", "contentType": "kpop", "contentTypeLabel": "K-Pop", "content_type": "kpop", "date": "2026-04-08", "created": "2026-04-08", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["spotify", "apple_music", "youtube"], "platformLabels": ["Spotify", "Apple Music", "YouTube"], "platform": "Spotify, Apple Music, YouTube", "artist": "AKMU (Akdong Musician)", "tags": ["AKMU, FLOWERING, 개화, Akdong Musician, Lee Chanhyuk, Lee Suhyun, 七年, 韓樂, Kpop, 獨立音樂, 成長, 情感"], "preview": "Option：七年成長版 AKMU 離開 YG Entertainment 後首張作品，七年時間沉澱，終於以自己節奏綻放。唔再係被包裝嘅K-pop偶像，係真正嘅音樂人宣言。 中文版本（粵/國） 粵語版 🌸 AKMU 歸來，但今次唔一樣。 《...", "content": "<p><strong>Option：七年成長版</strong><br>\nAKMU 離開 YG Entertainment 後首張作品，七年時間沉澱，終於以自己節奏綻放。唔再係被包裝嘅K-pop偶像，係真正嘅音樂人宣言。</p>\n<hr>\n<h3>中文版本（粵/國）</h3>\n<h4>粵語版</h4>\n<p>🌸 AKMU 歸來，但今次唔一樣。</p>\n<p>《FLOWERING》係七年後首張完整專輯。<br>\n唔催迫，唔比較，只係等待合適嘅時機為自己綻放。</p>\n<p>「成長唔係變老，係學識接受自己所有嘅情緒——<br>\n開心、悲傷、孤獨、期待，全部都係你身邊最重要嘅碎片。」</p>\n<p>七年，AKMU 終於游到自己嘅節奏。</p>\n<h1>AKMU #FLOWERING #個화 #AkdongMusician #七年 #為自己而開</h1>\n<h4>國語版</h4>\n<p>🌸 AKMU 回來了，但這次不一樣。</p>\n<p>《FLOWERING》是七年後首張完整專輯。<br>\n不催迫，不比較，只是一直等待合適的時機為自己綻放。</p>\n<p>「成長不是變老，是學會接受自己所有的情緒——<br>\n開心悲傷、孤獨期待，全部都是你身邊最重要的碎片。」</p>\n<p>七年，AKMU 終於游到自己嘅節奏。</p>\n<h1>AKMU #FLOWERING #개화 #AkdongMusician #七年 #為自己而開</h1>\n<hr>\n<h3>韓語版本</h3>\n<p>🌸 AKMU가 돌아왔지만, 이번엔 다르다.</p>\n<p>《개화(FLOWERING)》는 7년 만의 정규앨범이다.<br>\n재촉하지 않고, 비교하지 않고, 그저 자신의时机에 맞춰 피었다.</p>\n<p>「성장은 늙는 게 아니야.<br>\n모든 감정을 받아들이는 법을 배우는 거야.<br>\n기쁨도, 슬픔도, 외로움도, 기대도 — 전부 다 네게 필요한 조각이야.」</p>\n<p>7년, AKMU는 마침내 자신만의 속도로 피었다.</p>\n<h1>AKMU #개화 #FLOWERING #이찬혁 #이수현 #악동뮤지션 #7년만의정규앨범</h1>\n<hr>\n<h3>英文版本</h3>\n<p>🌸 AKMU is back — but this time, it's different.</p>\n<p>FLOWERING is their first full album in seven years.<br>\nNo rush. No comparisons. Just waiting for the right moment to bloom on their own terms.</p>\n<p>\"Growth isn't about getting older.<br>\nIt's about learning to embrace every emotion —<br>\njoy, sorrow, loneliness, anticipation.<br>\nAll of them are the pieces that make you whole.\"</p>\n<p>Seven years later, AKMU finally bloomed at their own pace.</p>\n<h1>AKMU #FLOWERING #AkdongMusician #LeeChanhyuk #LeeSuhyun #SevenYears #Kpop #IndieMusic #Bloom</h1>\n<hr>\n<h3>Hashtags</h3>\n<h1>AKMU #FLOWERING #개화 #악동뮤지션 #이찬혁 #이수현 #李燦赫 #李秀賢 #Kpop #IndiePop #Acoustic #七年 #獨立音樂 #成長 #情感 #為自己而開 #Bloom #Mood</h1>\n<hr>\n<h3>平台適用建議</h3>\n<ul>\n<li><strong>Instagram：</strong> 完整版（粵/國雙語 Carousel），配春天花開色調</li>\n<li><strong>Twitter/X：</strong> 國語版為主，140字內，加 2-3 個 Hashtags</li>\n<li><strong>Threads：</strong> 粵語版主打，生活化語氣，配 Album Cover 靚圖</li>\n<li><strong>TikTok：</strong> 英文版最啱，配 Album Trailer 片段 + 粉絲 reaction clips</li>\n<li><strong>YouTube Community：</strong> 韓語版，等粉絲可以了解背後意義</li>\n</ul>\n<hr>\n<h3>🎤 專輯預告版腳本</h3>\n<p><strong>長度：</strong> 45-60 秒<br>\n<strong>目的：</strong> 展示七年沉澱嘅意義，等粉絲明白呢張專輯嘅重量</p>\n<p><strong>Scene 1 (0-10s) — 時鐘倒帶</strong><br>\n- 画面：時鐘倒帶，由 2026 → 2019<br>\n- 旁白：「2019年，AKMU 最後一張正規專輯」<br>\n- 画面：舊MV片段剪輯（黑白處理）<br>\n- 🎵 配樂：純鋼琴，節奏緩慢</p>\n<p><strong>Scene 2 (10-25s) — 七年沉澱</strong><br>\n- 旁白：「七年，佢哋經歷咗乜？」<br>\n- 画面：<br>\n  - Lee Chanhyuk 嘅創作片段（Studio alone）<br>\n  - Lee Suhyun 嘅個人發展片段<br>\n  - YG 離開新聞截圖<br>\n- 🎵 配樂：節奏微微上揚</p>\n<p><strong>Scene 3 (25-45s) — FLOWERING 誕生</strong><br>\n- 旁白：「2026年4月7日，七年後——」<br>\n- 画面：花瓣慢慢展開，Flower blooming 延時片段<br>\n- Album Cover 慢慢浮現<br>\n- 🎵 配樂：《Joy, Sorrow, Beautiful Heart》副歌片段<br>\n- 最後字幕：「七年，終於為自己而開 #AKMU #FLOWERING」</p>\n<hr>\n<h3>🎬  Album Visualizer 解説版腳本</h3>\n<p><strong>長度：</strong> 90-120 秒<br>\n<strong>目的：</strong> 引導粉絲欣賞 Album Visualizer，了解每首歌嘅情緒</p>\n<p><strong>Introduction (0-15s)</strong><br>\n- 旁白：「七年後，AKMU 帶住《FLOWERING》歸來」<br>\n- 画面：Album Art 慢慢放大<br>\n- 說明：「11首歌曲，11個成長嘅碎片」</p>\n<p><strong>Track-by-Track Guide (每首 8-10秒):</strong></p>\n<p><strong>1. 소문의 낙원 (Paradise of Rumors)</strong><br>\n- 旁白：「起點——傳聞中嘅天堂，係真係假？」<br>\n- 画面：迷雾中行走的剪影<br>\n- 🎵 「소문의 낙원~」</p>\n<p><strong>2. 봄 색깔 (Spring Colors)</strong><br>\n- 旁白：「春天顏色——萬物復甦嘅顏色」<br>\n- 画面：花瓣飄落，綠芽生長<br>\n- 🎵 輕快嘅木結他</p>\n<p><strong>3. 벌레를 내고 (??? - 捉蟲)</strong><br>\n- 旁白：「清理內心——將唔再適合你嘅野剔除」<br>\n- 画面：手拆除舊牆紙嘅畫面<br>\n- 🎵 節奏突然停頓</p>\n<p><strong>4. 기쁨, 슬픔, 아름다운 마음 (Joy, Sorrow, Beautiful Heart)</strong><br>\n- 旁白：「主打——接受所有情緒，因為全部都係你」<br>\n- 画面：花瓣與雨滴同時落下，太陽與雲共存<br>\n- 🎵 副歌：「기쁨, 슬픔, 아름다운 마음~」<br>\n- 最後字幕：「#情緒自由」</p>\n<p><strong>5. 햇빛 bless you (陽光祝福你)</strong><br>\n- 旁白：「陽光——有時就係一句說話就可以改變一日」<br>\n- 画面：陽光穿透窗戶，灰暗房間突然明亮<br>\n- 🎵 温暖嘅人手結他</p>\n<p><strong>6. Tent (帳篷)</strong><br>\n- 旁白：「帳篷——保护罩，屬於自己嘅小空間」<br>\n- 画面：一個人喺帳篷內，安靜坐着<br>\n- 🎵 簡約鋼琴</p>\n<p><strong>7. 어린 부부 (Young Couple)</strong><br>\n- 旁白：「年輕夫妻——愛情的純真形態」<br>\n- 画面：兩個小孩手拖手背影<br>\n- 🎵 清純木結他</p>\n<p><strong>8. 옳은 사람 (Right Person)</strong><br>\n- 旁白：「對的人——等嘅過程中，唔好失去自己」<br>\n- 画面：分開行走的兩個人，但望向同一方向<br>\n- 🎵 中速節奏，略帶憂鬱</p>\n<p><strong>9. 우아한 아침 식사 (優雅早餐)</strong><br>\n- 旁白：「優雅早餐——日常都可以好有儀式感」<br>\n- 画面：慢動作倒咖啡，切水果<br>\n- 🎵 輕鬆愉快節奏</p>\n<p><strong>10. 난민들의 축제 (難民的節日)</strong><br>\n- 旁白：「難民的節日——邊緣人嘅慶典，唔完美但真實」<br>\n- 画面：多元文化人羣廣場慶典<br>\n- 🎵 節奏最強嘅一曲</p>\n<p><strong>11. (Final Track)</strong><br>\n- 旁白：「最後——所有碎片合埋一齊」<br>\n- 画面：全部顏色混合成白光<br>\n- 🎵 和煦收尾</p>\n<p><strong>Ending (最後10秒)</strong><br>\n- 旁白：「七年，終於——」<br>\n- Album Cover 完全呈現<br>\n- 字幕：「#AKMU #FLOWERING」</p>\n<hr>\n<h3>🎬 粉丝 reaction 模板腳本</h3>\n<p><strong>長度：</strong> 15-30 秒<br>\n<strong>目的：</strong> 鼓勵粉絲拍 reaction，等佢哋分享自己嘅七年</p>\n<p><strong>Template Script:</strong><br>\n1. 開頭：「聽完 AKMU《FLOWERING》之後...」<br>\n2. 展示 Album Cover（3秒）<br>\n3. 講一句感受：「最打動我嘅係...」（5-10秒）<br>\n4. Tag 錨點：「@AKMU @악동뮤지션 #AKMU #FLOWERING」（2秒）<br>\n5. End screen：「七年，邊個陪你走過？」</p>\n<p><strong>Tag Challenge:</strong></p>\n<h1>AKMU #FLOWERING #My7YearsChallenge</h1>\n<p>解釋：分享過去七年陪你走過嘅一首歌或者一個人</p>\n<hr>\n<h3>討論話題</h3>\n<p><strong>Q1：</strong> 你第一次聽 AKMU 係幾時？咩歌？</p>\n<p><strong>Q2：</strong> 七年係好長嘅時間，你呢七年入面有咩改變？</p>\n<p><strong>Q3：</strong> 「Joy, Sorrow, Beautiful Heart」——你最近一次接受自己悲傷係幾時？</p>\n<p><strong>Q4：</strong> AKMU 離開 YG 之後，你認為佢哋嘅音樂會有乜嘢改變？</p>\n<hr>\n<h3>投票調查</h3>\n<p>❓ <strong>《FLOWERING》最吸引你嘅元素係？</strong></p>\n<ul>\n<li>🌸 七年沉澱嘅意義</li>\n<li>🎵 Indie Pop / Acoustic 風格</li>\n<li>💔 「Joy, Sorrow, Beautiful Heart」嘅情感深度</li>\n<li>👥 AKMU 離開 YG 後嘅獨立姿態</li>\n<li>🌍 十一首歌嘅完整敘事</li>\n</ul>\n<hr>\n<h3>冷知識 Quiz</h3>\n<p><strong>❓ Q1：</strong> AKMU 上一次出正規專輯係幾時？<br>\nA. 2017年<br>\nB. 2018年<br>\nC. 2019年 ✅（正確答案）<br>\nD. 2020年</p>\n<p><strong>❓ Q2：</strong> 《FLOWERING》係 AKMU 第幾張正規專輯？<br>\nA. 第二張<br>\nB. 第三張<br>\nC. 第四張 ✅（正確答案）<br>\nD. 第五張</p>\n<p><strong>❓ Q3：</strong> AKMU 係由邊個公司成立？<br>\nA. JYP Entertainment<br>\nB. SM Entertainment<br>\nC. YG Entertainment ✅（正確答案，但2026年已離開）<br>\nD. HYBE</p>\n<p><strong>❓ Q4：</strong> AKMU 嘅成員名係？<br>\nA. Lee Chanhyuk &amp; Lee Suhyun（李燦赫 &amp; 李秀賢）✅<br>\nB. Park Jin-young &amp; IU<br>\nC. Kim Hyun-joong &amp; Lee Seung-gi<br>\nD. Bang Si-hyuk &amp; G-Dragon</p>\n<hr>\n<h3>風格參考 A：七年綻放感</h3>\n<p><strong>主題：</strong> 花朵在七年的等待後終於綻放</p>\n<blockquote>\n<p>A single flower blooming in an abandoned room over seven years, petals slowly unfurling through cracked concrete. Timelapse photography style, warm golden hour light streaming through broken windows. The flower is pink and delicate, contrasting with the rough gray walls. Cinematic, emotional, slightly melancholic but ultimately hopeful. Soft color grading with warm amber and soft pink tones. --ar 16:9 --style raw --v 6.1</p>\n</blockquote>\n<h3>風格參考 B：情緒花園感</h3>\n<p><strong>主題：</strong> Joy, Sorrow, Beautiful Heart——所有情緒如花園中同時存在</p>\n<blockquote>\n<p>A surreal garden where flowers and rain coexist — petals falling while raindrops glisten in sunlight. One path leads through the garden with both sunny and stormy sections merged. A young woman walking alone, unafraid of the mixed weather. Dreamy, ethereal, emotionally resonant photography. Soft focus, teal and gold tones, slightly melancholic atmosphere. --ar 9:16 --style raw --v 6.1</p>\n</blockquote>\n<h3>風格參考 C：七年時鐘感</h3>\n<p><strong>主題：</strong> 時間的重量</p>\n<blockquote>\n<p>A giant clock made of dried flowers, hands frozen at 7:00, vines slowly consuming the numbers. An open book lies beneath the clock, pages blank. Conceptual photography, muted earth tones with touches of pink flower petals. Moody, reflective, intellectual atmosphere. --ar 4:5 --style raw --v 6.1</p>\n</blockquote>\n<h3>Prompt 示例（可用於 Midjourney / DALL-E / Stable Diffusion）</h3>\n<pre><code>/imagine AKMU album cover concept: a person's hands holding a tiny blooming flower in a dark palm, seven years of dried petals scattered around, golden light from above, intimate close-up shot, soft cinematic lighting, pastel pink and warm amber tones, emotional and delicate atmosphere, album cover photography style --ar 1:1 --style raw --v 6.1\n</code></pre>\n<hr>\n<h3>為乜七年係咁重要？</h3>\n<p>AKMU 2014年出道，當時 Chanhyuk 同 Suhyun 係「兄妹組合」闖入 K-pop 世界。佢哋嘅音樂風格從來都唔係典型 K-pop——木結他、Acoustic Folk、 Indie Pop，喺 YG 体系入面係另類存在。</p>\n<p>2019年《Sailing》之後，AKMU 幾乎消失在公眾視線。 Chanhyuk 專注創作，Suhyun 發展個人風格。七年，剛好係一個人從青春期走入成年早期嘅全部時間。</p>\n<h3>離開 YG 係乜嘢意思？</h3>\n<p>YG Entertainment 係韓國三大經紀公司之一。離開意味住：<br>\n- 唔再有大公司嘅資源同曝光<br>\n- 但同時唔再需要配合商業化要求<br>\n- 可以完全掌控自己嘅音樂方向</p>\n<p>《FLOWERING》係一張「為自己而整」嘅專輯，唔係為市場、唔係為排行榜。</p>\n<h3>「Joy, Sorrow, Beautiful Heart」嘅情感深度</h3>\n<p>主打歌嘅核心係：<strong>接受所有情緒，因為佢哋構成完整嘅你。</strong></p>\n<blockquote>\n<p>「與其把悲傷推开，不如把它抱紧，因为它会变成最珍贵的东西。」</p>\n</blockquote>\n<p>呢種情感表達喺 K-pop 界好少見——唔係selling happiness，唔係假装坚强，係真實嘅情感接納。</p>\n<h3>十一首歌嘅敘事結構</h3>\n<p>如果將十一首歌當成一條成長嘅path：<br>\n1. <strong>入場</strong>——我哋從傳聞中嘅 Paradise 出發<br>\n2. <strong>復甦</strong>——感受春天嘅顏色<br>\n3. <strong>清理</strong>——剔除唔再屬於自己嘅嘢<br>\n4. <strong>核心</strong>——接受曉同悲傷，先係完整嘅心<br>\n5. <strong>温暖</strong>——陽光祝福你<br>\n6. <strong>保護</strong>——屬於自己嘅帳篷空間<br>\n7. <strong>純真</strong>——young couple 嘅愛<br>\n8. <strong>等待</strong>——尋找啱嘅人<br>\n9. <strong>日常</strong>——優雅嘅早餐，儀式感<br>\n10. <strong>邊緣</strong>——難民的節日，唔完美但真實<br>\n11. <strong>整合</strong>——所有碎片合埋一齊</p>\n<hr>\n<p>由 ccl 哥哥揀選完整版創作<br>\n創作日期：2026-04-08 by Hanni 🐰</p>", "cover": "", "sourcePath": "", "sourceUrl": ""}, {"id": 18, "title": "【SWIM】— 順着自己的節奏，游最適合的速度就夠", "contentType": "kpop", "contentTypeLabel": "K-Pop", "content_type": "kpop", "date": "2026-04-03", "created": "2026-04-03", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["instagram", "twitter", "threads", "tiktok"], "platformLabels": ["Instagram", "Twitter", "Threads", "TikTok"], "platform": "Instagram, Twitter, Threads, TikTok", "artist": "BTS (防彈少年團)", "tags": ["BTS, SWIM, ARIRANG, 防彈少年團, 韓樂, Kpop, 勵志, 自我成長"], "preview": "Option B：情感共鳴版 主打 Jimin 所說「反映 BTS 當下狀態」——經歷漫長寒冬後，選擇順着自己的節奏向前游。唔催迫自己，唔比較步伐，只係相信自己嘅速度。 中文版本（粵/國） 粵語版 🌊 BTS 歸來，但今次唔催迫你。 《SW...", "content": "<p><strong>Option B：情感共鳴版</strong><br>\n主打 Jimin 所說「反映 BTS 當下狀態」——經歷漫長寒冬後，選擇順着自己的節奏向前游。唔催迫自己，唔比較步伐，只係相信自己嘅速度。</p>\n<hr>\n<h3>中文版本（粵/國）</h3>\n<h4>粵語版</h4>\n<p>🌊 BTS 歸來，但今次唔催迫你。</p>\n<p>《SWIM》唔係叫你跑，叫你游。<br>\n潛入深海，唔使迫自己快，唔使理其他人嘅節奏。<br>\n最緊要係——你仲喺度，仲願意繼續游。</p>\n<p>「After the long winter, we finally dive into the deep blue together.」<br>\n寒冬過後，終於可以一齊潛入深藍。<br>\n今次唔比較，一起就得。</p>\n<h1>BTS #SWIM #ARIRANG #防彈少年團 #順着自己的節奏</h1>\n<h4>國語版</h4>\n<p>🌊 BTS 回來了，但這次不催迫你。</p>\n<p>《SWIM》不是叫你跑，是叫你游。<br>\n潛入深海，不用逼自己快，不用理其他人的節奏。<br>\n最重要的是——你還在，還願意繼續游。</p>\n<p>「After the long winter, we finally dive into the deep blue together.」<br>\n寒冬過後，終於可以一起潛入深藍。<br>\n這次不比較，一起就夠。</p>\n<h1>BTS #SWIM #ARIRANG #防彈少年團 #順著自己的節奏</h1>\n<hr>\n<h3>韓語版本</h3>\n<p>🌊 BTS가 돌아왔지만, 이번엔 널 재촉하지 않아.</p>\n<p>《SWIM》은 뛰라고 하는 게 아니야. 헤엄치라고.<br>\n깊은 바다로 diving, 빠르게 가라고 하지 않아.<br>\n남들과 속도를 비교하지 않아도 돼.</p>\n<p>가장 중요한 건 — 넌 아직 여기, 여전히 앞으로 가고 싶다는 것.</p>\n<p>「After the long winter, we finally dive into the deep blue together.」<br>\n긴 겨울이 지나, 마침내 함께 deep blue로 다이빙.<br>\n이번엔 비교하지 않아. 함께라면 충분해.</p>\n<h1>BTS #SWIM #ARIRANG #방탄소년단 #나만의속도</h1>\n<hr>\n<h3>英文版本</h3>\n<p>🌊 BTS is back — but this time, we're not rushing you.</p>\n<p>SWIM isn't about running. It's about diving.<br>\nInto the deep blue. At your own pace. No comparisons.</p>\n<p>What matters most? You're still here. Still willing to keep going.</p>\n<p>「After the long winter, we finally dive into the deep blue together.」<br>\nAfter the longest winter, we finally dove into the deep blue as one.<br>\nNo race. Just us, moving forward together.</p>\n<h1>BTS #SWIM #ARIRANG #BTSARMY #AtYourOwnPace #KeepSwimming</h1>\n<hr>\n<h3>Hashtags</h3>\n<h1>BTS #SWIM #ARIRANG #방탄소년단 #防彈少年團 #BTSARMY #Kpop #NewMusic #Comeback #AlternativeRandB #DreamPop #深海 #順著自己的節奏 #AtYourOwnPace #KeepSwimming # Jimin #Rm #JungKook #Pdogg</h1>\n<hr>\n<h3>平台適用建議</h3>\n<ul>\n<li><strong>Instagram：</strong> 完整版（粵/國雙語 Carousel），配海藍色調 filter</li>\n<li><strong>Twitter/X：</strong> 國語版為主，140字內，加 2-3 個 Hashtags</li>\n<li><strong>Threads：</strong> 粵語版主打，生活化語氣，配 MV 金句 screenshot</li>\n<li><strong>TikTok：</strong> 英文版最啱，配 MV 片段 + 粉絲 reaction clips</li>\n</ul>\n<hr>\n<h3>🎤 舞蹈版腳本</h3>\n<p><strong>長度：</strong> 30-45 秒<br>\n<strong>目的：</strong> 展示編舞亮點，等粉絲可以跟住跳</p>\n<p><strong>Scene 1 (0-10s) — Opening Shot</strong><br>\n- 画面：成員一字排開面向鏡頭，海浪背景<br>\n- 編舞重點：<strong>雙手由下向上拉開</strong>，如同拉開水面<br>\n- 表情：冷静但有決心<br>\n- 🎵 配樂：前奏鋼琴漸強</p>\n<p><strong>Scene 2 (10-25s) — Chorus Dance</strong><br>\n- 画面：成員分散，每人有獨立 shot<br>\n- 編舞重點：<br>\n  - <strong>手臂划水動作</strong>（呼應 SWIM 主題）<br>\n  - <strong>定點爆發</strong> moment：雙手向外展 + 抬頭<br>\n  - 整齊但有個性嘅 group dance<br>\n- 🎵 配樂：「dive into the deep blue...」</p>\n<p><strong>Scene 3 (25-40s) — Ending</strong><br>\n- 画面：全部人聚攏，形成圓形<br>\n- 編舞重點：<strong>集體向水面伸出手</strong>（象徵一起浮出水面）<br>\n- 表情：温暖、释然<br>\n- 🎵 配樂：的最後一句「...together」</p>\n<p><strong>拍攝建議：</strong><br>\n- 室外水池拍攝，陽光折射效果<br>\n- 慢動作回放配合最後導語</p>\n<hr>\n<h3>🎬 幕後版腳本</h3>\n<p><strong>長度：</strong> 60-90 秒<br>\n<strong>目的：</strong> 挖掘專輯故事，增加情感深度</p>\n<p><strong>Scene 1 (0-15s) — 專輯背景</strong><br>\n- 旁白：「ARIRANG，呢個名取自一首130年歷史嘅韓國民歌」<br>\n- 画面：黑白歷史片段 + 現代 BTS 排練畫面交替<br>\n- 🎵 配樂：ARIRANG 旋律片段（純音樂）</p>\n<p><strong>Scene 2 (15-35s) — SWIM 創作故事</strong><br>\n- 訪問片段：Jimin 說「SWIM 反映我哋而家嘅狀態」<br>\n- RM、Jung Kook、Pdogg 嘅創作訪問片段<br>\n- 画面：studio 創作過程，BTS 成員表情認真但輕鬆<br>\n- 🎵 配樂：SWIM Instrumental</p>\n<p><strong>Scene 3 (35-60s) — MV拍攝亮點</strong><br>\n- Lili Reinhart cameo 片段（預告風格）<br>\n- 海上拍攝幕後：導演解說設定<br>\n- 成員喺船上拍攝，頭髮被風吹起嘅自然 moments<br>\n- 🎵 配樂：SWIM 副歌</p>\n<p><strong>Scene 4 (60-90s) — 結語</strong><br>\n- 全部成員面对镜头講一句鼓励说话<br>\n- RM: 「唔使迫自己」<br>\n- J-Hope: 「游你嘅速度」<br>\n-  Jimin: 「我哋一齊」<br>\n- 🎵 配樂：漸弱至純鋼琴</p>\n<hr>\n<h3>🎮 挑戰版腳本 — Fan Challenge：「#SWIMChallenge」</h3>\n<p><strong>長度：</strong> 15-20 秒<br>\n<strong>目的：</strong> 簡單易學，等粉絲可以廣泛參與</p>\n<p><strong>規則說明（文字疊加）：</strong><br>\n1. 任何地方都可以開始（泳池/浴缸/甚至想像中）<br>\n2. 播放 SWIM 副歌<br>\n3. 做出「划水動作」（雙手由前向後划）<br>\n4. 然後向上伸出手（象徵浮出水面）<br>\n5. 微笑面向鏡頭</p>\n<p><strong>拍攝模板：</strong><br>\n- Countdown 3-2-1 開始<br>\n- 前半：你自己做動作<br>\n- 後半：加入文字「@你認識嘅人一齊 SWIM」</p>\n<p><strong>Tag 鼓勵：</strong><br>\n- #SWIMChallenge<br>\n- #BTSARMY<br>\n- #SWIMxBTS</p>\n<hr>\n<h3>討論話題</h3>\n<p><strong>Q1：</strong> 你最近一次「覺得游唔動」係幾時？你係點樣比自己繼續游落去？</p>\n<p><strong>Q2：</strong> BTS 七年依然喺度，呢件事對你有咩意義？</p>\n<p><strong>Q3：</strong> 如果你可以帶一首歌去任何地方，你會帶《SWIM》嗎？為什麼？</p>\n<hr>\n<h3>投票調查</h3>\n<p>❓ <strong>《SWIM》最打動你嘅元素係？</strong></p>\n<ul>\n<li>🌊 歌曲主題（順着自己的節奏）</li>\n<li>🎵 Alternative R&amp;B 風格</li>\n<li>💃 編舞設計</li>\n<li>🎬 MV（Lili Reinhart cameo + 海上場景）</li>\n<li>👥 BTS 七年情嘅感動</li>\n</ul>\n<hr>\n<h3>冷知識 Quiz</h3>\n<p><strong>❓ Q1：</strong> ARIRANG 呢張專輯名稱取自一首韓國傳統民歌，呢首歌大約有幾多年歷史？<br>\nA. 50 年<br>\nB. 100 年<br>\nC. 130 年 ✅（正確答案）<br>\nD. 200 年</p>\n<p><strong>❓ Q2：</strong> SWIM 係 ARIRANG 專輯嘅第幾 track？<br>\nA. 第 1 track<br>\nB. 第 3 track<br>\nC. 第 5 track<br>\nD. 第 7 track ✅（正確答案）</p>\n<p><strong>❓ Q3：</strong> SWIM MV 入面有邊位 Hollywood 演員 cameo？<br>\nA. Lily Collins<br>\nB. Lili Reinhart ✅（正確答案）<br>\nC. Emma Watson<br>\nD. Zendaya</p>\n<hr>\n<h3>風格參考 A：溫暖希望感</h3>\n<p><strong>主題：</strong> 寒冬後的第一縷光</p>\n<blockquote>\n<p>A group of seven young men standing on a boat at golden hour, arms reaching toward the camera. The ocean is calm and glowing in shades of deep blue and amber. One figure has his eyes closed, taking a deep breath. Cinematic lighting, reminiscent of coming-of-age films. Soft color grading with teal and orange tones. --ar 16:9 --style raw --v 6.1</p>\n</blockquote>\n<h3>風格參考 B：夢幻深海感</h3>\n<p><strong>主題：</strong> 潛入深藍的自由</p>\n<blockquote>\n<p>Seven silhouettes diving into an endless deep blue ocean from above, sunlight streaming down like a waterfall. One figure is swimming upward alone while others follow. Surreal underwater photography style, volumetric light rays, teal and navy color palette. Dreamy and ethereal atmosphere. --ar 9:16 --style raw --v 6.1</p>\n</blockquote>\n<h3>風格參考 C：情緒共鳴感</h3>\n<p><strong>主題：</strong> 順着自己的節奏</p>\n<blockquote>\n<p>Close-up of a young man's profile, eyes reflecting the ocean waves, looking contemplative. Hair slightly wet, wearing a white loose shirt. The background is blurred ocean at sunset with warm orange and pink tones. Minimalist, emotional photography. --ar 4:5 --style raw --v 6.1</p>\n</blockquote>\n<h3>Prompt 示例（可用於 Midjourney / DALL-E / Stable Diffusion）</h3>\n<pre><code>/imagine BTS members standing on a wooden boat at sunrise, ocean calm in deep sapphire blue, golden hour light, reaching hands upward together toward the light, cinematic film grain, teal and amber tones, male K-pop group, confident yet peaceful expressions, photorealistic, 16:9 aspect ratio --style raw --v 6.1\n</code></pre>\n<hr>\n<p>由 ccl 哥哥揀選 Option B（情感共鳴版）創作<br>\n創作日期：2026-04-03 by Hanni 🐰</p>", "cover": "", "sourcePath": "", "sourceUrl": ""}, {"id": 19, "title": "《逐玉》— 古裝陸劇如何打破韓流壟斷 Netflix？", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-03-29", "created": "2026-03-29", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["netflix"], "platformLabels": ["Netflix"], "platform": "Netflix", "artist": "", "tags": ["古裝, 陸劇, Netflix, 先婚後愛, 張凌赫, 田曦薇"], "preview": "過去幾年，Netflix 和 Disney+ 的亞洲內容版圖幾乎由韓劇主導。從早年的驚悚題材到近期的浪漫喜劇，平台演算法總是偏愛韓國製作。然而，2026 年三月上線的古裝陸劇《逐玉》，卻帶來了一場結結實實的突圍戰。 根據官方最新公布的數據，...", "content": "<p>過去幾年，Netflix 和 Disney+ 的亞洲內容版圖幾乎由韓劇主導。從早年的驚悚題材到近期的浪漫喜劇，平台演算法總是偏愛韓國製作。然而，2026 年三月上線的古裝陸劇《逐玉》，卻帶來了一場結結實實的突圍戰。</p>\n<p>根據官方最新公布的數據，這部劇集單週觀看次數高達 <strong>190 萬</strong>，一口氣打進 <strong>9 個國家和地區的熱門前十名</strong>，成為史上首部登上 Netflix 全球非英語週榜的陸劇。能在以歐美及韓流為主的串流戰場中殺出一條血路，這份成績單對華語影視圈而言，絕對是一個重要里程碑。</p>\n<hr>\n<p>《逐玉》的視覺美學獲得極高讚譽，導演精準捕捉張凌赫那種「清冷與破碎感交織」的美。觀眾評價道：「每一幀畫面都像是寫給張凌赫的一封情書」，並讚嘆導演透過女主角的視角帶領觀眾沉溺於這份美貌衝擊。</p>\n<p>男神張凌赫在劇中飾演落難侯爺謝征，角色設定層次豐富——從隱忍低調到狠戾反擊，雙面性格精準拿捏，演技備受肯定。</p>\n<hr>\n<p>田曦薇飾演的屠戶女樊長玉，一改觀眾對她「甜妹」的既定印象，武力值爆燈之餘，更在社交平台引爆熱議——她輕鬆背起 190cm 高的張凌赫，有趣場面讓網友大呼「最强反差 CP」。</p>\n<p>兩人「假婚真爱」的設定，由最初的互相利用，到後來真心交付，甜虐節奏掌握得恰到好處，觀眾黏著度極高。</p>\n<hr>\n<p>《逐玉》另一成功關鍵，在於「極致雕花」般的精緻服化道。從演員妝容到場景陳設，每個細節都一絲不苟，成功營造出亂世古裝的史詩感。配合「先婚後愛」的清晰框架，觀眾能快速投入劇情，獲得源源不絕的「爽感」。</p>\n<hr>\n<h3>結局洩露風波</h3>\n<p>《逐玉》尚未播畢，結局高清片源已在網上瘋傳。劇組及三大串流平台（騰訊視頻、愛奇藝、優酷）聯合發表聲明，強調將追查洩露源頭，依法追究法律責任。</p>\n<h3>劇情節奏爭議</h3>\n<p>部分觀眾指出劇情推進稍慢，權謀線交代稍嫌混亂；另有觀眾吐槽「冬天拿着扇子」等邏輯漏洞。先甜後虐的轉折，亦有觀眾認為來得過於突然，情緒準備不足。</p>\n<hr>\n<p>《逐玉》的成功，證明瞭優質製作與精準市場定位，足以打破語言與文化壁壘。張凌赫與田曦薇這對「最强反差 CP」，以顔值與化學反應成功攻陷海外觀眾，為陸劇出海寫下重要一章。儘管爭議難免，但作為現象級作品，《逐玉》足以在 2026 年的華語劇集中佔據一席之地。</p>\n<p><strong>必看指數：⭐⭐⭐⭐⭐（5/5）</strong></p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-03-29-逐玉.md"}, {"id": 20, "title": "《唱錢》與香港音樂節目的十字路口", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-03-28", "created": "2026-03-28", "updated": "2026-10-22", "status": "draft", "statusLabel": "草稿", "platforms": ["tvb", "viutv"], "platformLabels": ["TVB", "ViuTV"], "platform": "TVB, ViuTV", "artist": "", "tags": ["香港電視, 音樂節目, TVB, ViuTV, 粵語流行曲, 行業分析"], "preview": "此文章尚未公開，草稿內容只保留喺本地創作空間。", "content": "<div class=\"locked-note\"><span class=\"locked-glyph\" aria-hidden=\"true\">🔒</span><p><strong>此文章尚未公開</strong></p><p>草稿內容只保留喺本地創作空間，唔會出現喺公開版 Dashboard。</p></div>", "cover": "", "sourcePath": "", "sourceUrl": ""}, {"id": 21, "title": "《機智女法醫2》— 古裝 forensic 加外交陰謀，TVB外購難得冇仆街", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-03-25", "created": "2026-03-25", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["tvb"], "platformLabels": ["TVB"], "platform": "TVB", "artist": "", "tags": ["TVB, 外購劇, 古裝, 懸疑, forensic, 機智女法醫2, 御賜小仵作2"], "preview": "《御賜小仵作2》大家都知，內地騰訊播嘅時候熱度2.1萬、播放量1.18億。TVB 3月5日拎咗上翡翠台配音做晚晚9:30外購劇，仲要有 冠名贊助 。 TVB 黃金檔冠名有門檻，唔係有錢就上到，係要節目有一定質素先會有廣告商願意用自己品牌命名...", "content": "<p>《御賜小仵作2》大家都知，內地騰訊播嘅時候熱度2.1萬、播放量1.18億。TVB 3月5日拎咗上翡翠台配音做晚晚9:30外購劇，仲要有<strong>冠名贊助</strong>。</p>\n<p>TVB 黃金檔冠名有門檻，唔係有錢就上到，係要節目有一定質素先會有廣告商願意用自己品牌命名呢個時段。呢個門檻唔會減價sell，變相係幫呢套劇嘅<strong>內地口碑已驗證</strong>——有基本收視保證，贊助商先肯入紙。</p>\n<hr>\n<p>《機智女法醫2》改編自小說《名捕夫人》，背景唐中晚期，延續上一季設定——楚楚已係御賜仵作，嫁咗郡王蕭瑾瑜，婚後育有一仔。今季主線「血色玉韘案」——由一具佩戴血色玉韘嘅屍體開始，逐步揭發南趙意圖入侵大唐嘅陰謀，層層加碼到18年前先帝暴斃舊案。</p>\n<p><strong>重點係：全部破解起點，都係楚楚驗到嘅一具屍。</strong></p>\n<p>最新第15集大反轉——楚楚發現宮中聲稱死亡嘅南趙二王子祐辰安，「遺體」上舊傷特徵與真人唔符，<strong>確定：那具屍體根本唔係佢</strong>。南趙王派佢出使，不過一早當佢係棋子。 forensic 角度嘅妙處就喺呢度——用驗屍破解外交陰謀，呢個就係TVB自己拍唔出嘅格局。</p>\n<hr>\n<p>以前外購古裝成日被彈「配音怪」——演員嘴型對唔上、配樂突兀、節奏慢咗幾拍。《機智女法醫2》今次<strong>TVB配音</strong>大致過關，演員語氣冇甩beat，至少聽落唔會令人想轉台。對唔鍾意配音、慣咗睇字幕嘅後生仔係加分位。</p>\n<hr>\n<p>蕭瑾瑜染上疳霉瘡但繼續瞞病情救老婆，典型霸總今次有眼濕位。景翊 × 冷月由歡喜冤家升到相依相守，感情線自然唔催淚——唔會為咗催谷收視硬加一段三角戀。南趙二王子祐辰安以為係普通使者，原來另有目的，劇情走向取決於佢係友係敵。</p>\n<hr>\n<p>過去TVB外購古裝多數水土不服，但今次有內地口碑打底、題材夠獨特（香港少見 forensic）、配音過關、節奏唔拖，每集有爆點唔會為咗拖集數加無謂感情線。<strong>88萬觀眾捧場</strong>，師奶界應該幾收貨。</p>\n<p><strong>forensic 加外交陰謀，楚楚驗嘅唔止係屍，係成個朝代嘅真相。</strong></p>\n<hr>\n<p><em>📺 TVB翡翠台外購 / 原版：《御賜小仵作2》/ 👤 王子奇、蘇曉彤、楊廷東、趙堯珂 / 🎤 TVB粵語配音 / 💰 冠名贊助（黃金檔門檻）/ 📅 播出中，大結局4月3日</em></p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-03-25-機智女法醫2.md"}, {"id": 22, "title": "《正義女神》— 從法袍到法袍，佘詩曼這次不放過任何一個「壞孩子」", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-03-24", "created": "2026-03-24", "updated": "2026-10-22", "status": "draft", "statusLabel": "草稿", "platforms": ["tvb"], "platformLabels": ["TVB"], "platform": "TVB", "artist": "", "tags": ["TVB, 佘詩曼, 法律, 少年法庭, 劇評"], "preview": "此文章尚未公開，草稿內容只保留喺本地創作空間。", "content": "<div class=\"locked-note\"><span class=\"locked-glyph\" aria-hidden=\"true\">🔒</span><p><strong>此文章尚未公開</strong></p><p>草稿內容只保留喺本地創作空間，唔會出現喺公開版 Dashboard。</p></div>", "cover": "", "sourcePath": "", "sourceUrl": ""}, {"id": 23, "title": "《愛情怎麼翻譯？》— 語言天才與國際巨星，愛能跨越幾多語言？", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-03-22", "created": "2026-03-22", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["netflix"], "platformLabels": ["Netflix"], "platform": "Netflix", "artist": "", "tags": ["Netflix, 韓劇, 愛情, 金宣虎, 高允貞, 洪氏姊妹"], "preview": "語言，是橋樑還是牆？ Netflix 新劇《愛情怎麼翻譯？》（Can This Love Be Translated？）由《德魯納酒店》《還魂》的洪氏姊妹編劇，《契約友情》《紅丹心》的柳英恩導演，2026年1月16日全球首播。演員陣容包括金...", "content": "<p>語言，是橋樑還是牆？</p>\n<p>Netflix 新劇《愛情怎麼翻譯？》（Can This Love Be Translated？）由《德魯納酒店》《還魂》的洪氏姊妹編劇，《契約友情》《紅丹心》的柳英恩導演，2026年1月16日全球首播。演員陣容包括金宣虎、高允貞、福士蒼汰，遠赴日本、加拿大、意大利取景。</p>\n<p>故事講述天才口譯員周浩鎮（金宣虎 飾），精通六種語言，綽號「Papago」，卻是愛情白癡。國際巨星車茂熙（高允貞 飾）因喪屍電影一炮而紅，卻在走紅後陷入公眾人物的孤獨。兩人因為一檔真人秀《浪漫之旅》重新相遇——茂熙與日本演員黑澤博（福士蒼汰 飾）出演戀愛節目，浩鎮受聘擔任翻譯。</p>\n<p>問題來了：當翻譯軟件能即時轉換語言，點解兩個人仍然無法理解彼此？</p>\n<p>《愛情怎麼翻譯？》唔係典型甜寵劇。洪氏姊妹這次沒有寫童話，而是寫了一個關於「無法表達」的故事。</p>\n<p>浩鎮的问题是：他懂得所有語言，卻不懂得怎麼說「我愛你」。茂熙的問題是：她是公眾人物，早已習慣戴上口罩說話。兩人之間隔着的，不只是六種語言，還有創傷、逃避、與自我保護。</p>\n<p>劇評普遍認為，這部劇觸及了「創傷」「語言隔閡」「公眾人物的異化」以及「迴避型依附」等心理層面。有評價指它「最甜也最寂寞」，甜戲不多，但每一場對話都有重量。</p>\n<p>金宣虎與高允貞的螢幕化學反應獲得一致讚賞，被形容為「神顏CP」。劇組遠赴鎌倉、意大利等風景優美的地方拍攝，每一幀都可以截圖做wallpaper。但風景再美，都唔夠兩個人的眼神交戲好看。</p>\n<p>值得一讚的是福士蒼汰扮演的日本演員黑澤博——呢個角色並非簡單的情敵，而係映照出兩位主角內心的一面鏡子。</p>\n<p>如果要用一句話總結《愛情怎麼翻譯？》，我會話：<strong>「語言係工具，愛係選擇。」</strong></p>\n<p>劇中有一句台詞大概係咁講的：「即使我地語言相通，我地仍然可能係陌生人。」呢個先係最殘忍又最真實嘅地方。</p>\n<p>推介俾：喜歡深度愛情劇、對心理描寫有興趣、願意思考「溝通」真正意思嘅觀眾。</p>\n<hr>\n<p><em>資料來源：維基百科、Elle、Vocus、Beauty321、Yahoo新聞（2026年3月）</em></p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-03-22-愛情怎麼翻譯.md"}, {"id": 24, "title": "《小城大事》— 趙麗穎×黃曉明演活基層奇蹟", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-03-21", "created": "2026-03-21", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["wetv"], "platformLabels": ["WeTV"], "platform": "WeTV", "artist": "", "tags": ["陸劇, 年代劇, 改革開放, 趙麗穎, 黃曉明, 評測"], "preview": "如果話2026年1月有邊套陸劇係唔可以錯過，《小城大事》一定係其中之一。 趙麗穎同黃曉明呢對「強強聯手」嘅組合，一文一武、一個留法歸來、一個扎根泥土，喺資源匱乏、沒有國家撥款嘅艱困條件下，帶住小鎮基層幹部同鎮民，「集資合夥」一步步起出一座現...", "content": "<p>如果話2026年1月有邊套陸劇係唔可以錯過，《小城大事》一定係其中之一。</p>\n<p>趙麗穎同黃曉明呢對「強強聯手」嘅組合，一文一武、一個留法歸來、一個扎根泥土，喺資源匱乏、沒有國家撥款嘅艱困條件下，帶住小鎮基層幹部同鎮民，「集資合夥」一步步起出一座現代城市。</p>\n<hr>\n<p>呢套劇最打動我嘅地方，係角色塑造。</p>\n<p><strong>趙麗穎</strong> 飾演嘅李秋萍唔係典型大女主，唔係完美人設，而係一個會害怕、會猶豫、會犯錯嘅普通人。全素顏、方言原聲演出，為戲增重8公斤，展現基層女幹 部嘅敬業同硬骨頭精神。</p>\n<p><strong>黃曉明</strong> 為咗角色狠甩15公斤，褪晒「霸總」外殼，以一身土氣但扎實嘅草根氣質回歸。佢飾演嘅鄭德誠唔係正派亦唔係反派，而係一個喺現實中左右為難嘅中年人——呢種灰色地帶先至係我哋身邊真實存在嘅人。</p>\n<hr>\n<p>兩位演員都交出咗「毀容式」演出：</p>\n<ul>\n<li>趙麗穎全素顏喺暴雨中搶險，無台詞眼神戲成為加分關鍵</li>\n<li>黃曉明「吃紙耍賴」嘅即興表演，展現前所未見嘅演技層次</li>\n<li>趙麗穎喺訪問入面笑住話黃曉明「這是毛病吧？」，延續《中餐廳》嘅歡喜冤家化學反應</li>\n</ul>\n<hr>\n<p>呢套劇用輕喜劇形式包裝改革開放呢個厚重主題，係創作者嘅自覺追求——</p>\n<blockquote>\n<p>以「小城」嘅微觀視角承載「大事」嘅時代分量，為主旋律題材煥發出新嘅思想活力同情感溫度。</p>\n</blockquote>\n<p>跳 出歌頌成就嘅單一框架，係近年陸劇少見嘅膽試。唔洗捱苦情催淚，但睇完會真心覺得：改革開放呢個世代，的確有一班人用血肉之軀創造奇蹟。</p>\n<hr>\n<p>隨著口碑發酵，《小城大事》打趴同檔宋威龍主演嘅《驕陽似我》收視奪冠，絕對係實力證明。</p>\n<hr>\n<p>✅ 你喜歡《風吹半夏》《幸福到萬家呢類寫實風格<br>\n✅ 你想了解改革開放歷史但又怕悶<br>\n✅ 你想睇演員「毀容式」嘅敬業演出<br>\n✅ 你中意有血肉嘅角色塑造</p>\n<p>❌ 如果你想要愛情線好重嘅偶像劇，就skip呢套</p>\n<hr>\n<p><strong>總結</strong>：⭐⭐⭐⭐⭐（5/5）</p>\n<p>《小城大事》唔係嗰種你要「追」嘅爆款，而係一套值得靜下心嚟睇、慢慢感受嘅作品。趙麗穎同黃曉明嘅化學反應係驚喜，輕喜劇嘅包裝方式令沉重歷史變得易入口——2026年目前最推薦嘅陸劇，絕對係呢套。</p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-03-21-xiaocheng-dashi.md"}, {"id": 25, "title": "《訂閱男友》— Jisoo 挑戰虛擬戀愛，係創新定係呃Like？", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-03-20", "created": "2026-03-20", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["netflix"], "platformLabels": ["Netflix"], "platform": "Netflix", "artist": "", "tags": ["Netflix, 韓劇, Jisoo, K-Pop, 虛擬戀愛, AI"], "preview": "由 BLACKPINK Jisoo 主演既《訂閱男友》（Boyfriend on Demand）3月6日正式登陸 Netflix。故事講述女主角「徐未來」透過一個「虛擬戀愛訂閱」服務，一次過解鎖八種理想型——霸總、白馬王子、校園初戀，乜類型...", "content": "<p>由 BLACKPINK Jisoo 主演既《訂閱男友》（Boyfriend on Demand）3月6日正式登陸 Netflix。故事講述女主角「徐未來」透過一個「虛擬戀愛訂閱」服務，一次過解鎖八種理想型——霸總、白馬王子、校園初戀，乜類型都有。</p>\n<p>呢個設定直頭係為咗我哋呢啲「岩岩失戀」或者「對現實戀愛乸聲」既都市人度身訂造：唔洗付出真心，又可以享受到戀愛既甜——呢個世界到底係進步定係悲哀？</p>\n<p>老實講，Jisoo 既演技之前大家都會質疑——畢竟「人間 DIOR」做歌手就得，做戲就得唔得？</p>\n<p>今次佢既要應付「一次過約會 9 個男人」既場面，又要展現對「虛擬」同「真實」既掙扎。我覺得佢既進步係明顯既——起碼做唔到死板的「女神」表情，會有啲小女生既扭擰同心事。</p>\n<p>同徐仁國既 Kiss 場戲就最多人討論，網上瘋傳既片段都幾🔥。</p>\n<p>呢套劇既核心，其實係探討一個好時代既問題：<strong>「如果愛情可以零風險，你仲使唔使去愛？」</strong></p>\n<p>編劇最後既選擇幾有意思——Jisoo 唔係揀任何一個「訂閱男友」，而係揀咗現實中既朴慶南。呢個係咪即係話「冇痛既戀愛唔係真正既戀愛」？定係ampion「虛擬野終歸都係假」？</p>\n<p>我個人覺得呢套劇「創意有餘，深入不足」。佢提出咗好好既問題（AI 戀愛、虛擬情感），但係用「下飯劇」「輕鬆高甜」既包裝，反而冇咁多位去探討呢啲咁deep既議題。</p>\n<p>如果你鍾意睇靚人靚景、輕鬆呃時間，呢套 OK。但如果你期待好似《黑暗榮耀》咁有深度既 Jisoo，可能要等多幾套。</p>\n<p><strong>Score: 6.5/10</strong> — 有驚喜，但未夠震撼。</p>\n<hr>\n<p><em>有興趣可以留意：Jisoo 現實中既身價已經飆升 HK$9.2億，呢套劇會唔會令佢既演員路更順？</em></p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-03-20-訂閱男友.md"}, {"id": 26, "title": "《足球女將2》— 續作的尷尬與ViuTV的隱憂", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-03-19", "created": "2026-03-19", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["viutv"], "platformLabels": ["ViuTV"], "platform": "ViuTV", "artist": "", "tags": ["ViuTV, 足球劇, 劇評"], "preview": "曾幾何時，《足球女將》第一季以「熱血」與「真實感」殺出一條血路，成為近年本地足球劇的代表作。然而，當第二季千呼萬喚始出來，換來的卻是「期望越大，失望越大」的普遍評價。這不僅是一套續集的失敗，更是ViuTV在劇集延續能力上的一次檢驗。", "content": "<p>曾幾何時，《足球女將》第一季以「熱血」與「真實感」殺出一條血路，成為近年本地足球劇的代表作。然而，當第二季千呼萬喚始出來，換來的卻是「期望越大，失望越大」的普遍評價。這不僅是一套續集的失敗，更是ViuTV在劇集延續能力上的一次檢驗。</p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-03-19-足球女將2.md"}, {"id": 27, "title": "《臥底嬌娃》— 市場定位兩邊唔到岸既典型", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-03-19", "created": "2026-03-19", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["tvb"], "platformLabels": ["TVB"], "platform": "TVB", "artist": "", "tags": ["TVB, 警匪劇, 劇評"], "preview": "《臥底嬌娃》（前名《特勤女團》），由方駿钊監製、邵麗瓊編審，張曦雯，陳瀅、羅毓儀、馬貫東等主演。題材本身有啲諗頭——臥底女團、輕鬆動作喜劇，方向擺明係想吸年輕觀眾。但睇完成套劇，你會發現問題唔係方向，而係——班底撐唔起。", "content": "<p>《臥底嬌娃》（前名《特勤女團》），由方駿钊監製、邵麗瓊編審，張曦雯，陳瀅、羅毓儀、馬貫東等主演。題材本身有啲諗頭——臥底女團、輕鬆動作喜劇，方向擺明係想吸年輕觀眾。但睇完成套劇，你會發現問題唔係方向，而係——班底撐唔起。</p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-03-19-臥底嬌娃.md"}, {"id": 28, "title": "《歲月如歌》— 零討論度背後的系統問題", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-03-19", "created": "2026-03-19", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["hoy_tv"], "platformLabels": ["HOY TV"], "platform": "HOY TV", "artist": "", "tags": ["HOY TV, 歌唱節目, 綜藝, 劇評"], "preview": "《歲月如歌》——HOY TV年度大型跨平台、跨地區歌唱節目，喺香港著名地標戲曲中心拍攝，仲要拎埋政府「創意智優計劃」主要資助。聽落好似好巴閉？但如果你上網搜尋呢個節目，你會發現——基本上冇人討論。 呢個現象唔係單純「節目唔好睇」咁簡單，而係...", "content": "<p>《歲月如歌》——HOY TV年度大型跨平台、跨地區歌唱節目，喺香港著名地標戲曲中心拍攝，仲要拎埋政府「創意智優計劃」主要資助。聽落好似好巴閉？但如果你上網搜尋呢個節目，你會發現——基本上冇人討論。</p>\n<p>呢個現象唔係單純「節目唔好睇」咁簡單，而係反映緊一連串既結構性問題。</p>\n<p>一個節目冇人討論，通常有幾個原因：內容唔夠吸引、宣傳做得差、平台本身冇流量。但《歲月如歌》既問題，似乎特別複雜——佢有政府資助、有戲曲中心呢類靚場地、有歌唱嘉賓既表面架勢，但就偏偏乜都冇。</p>\n<p>《歲月如歌》作為一個歌唱節目，本身就要面對一個激烈既競爭市場。本地歌唱節目唔算多，但要突圍並唔容易——你要同過往既經典歌唱節目比較，要同歌手本身既粉絲基礎掛鈎，仲要同節目本身既製作質素掛鈎。</p>\n<p>如果節目只係「請啲歌手嚟唱幾首歌」，咁就太過單一。觀眾而家想要既，唔係淨係「聽歌」，而係「睇故事」——歌手既背景、選曲既原因、比賽既張力。但從目前既討論度嚟睇，《歲月如歌》似乎冇做到呢啲。</p>\n<p>節目屬於HOY TV高層變動之後推出，呢個時間點好敏感——新管理層上台，通常會有新既策略方向、新既節目理念。但如果節目係「前朝規劃／前團隊製作」，咁就會出現一個尷尬既情況：節目做完之後，新管理層唔會花太多資源去推廣，結果就變成「做完算数」。</p>\n<p>電視台高層變動，對節目既影響可以好大。主要唔係節目本身既質素，而係資源分配、宣傳策略、同定位調整。《歲月如歌》有冇受到呢啲因素影響？我唔知具体內部情況，但從「零討論度」呢個結果反推，呢啲因素「某程度上」應該存在。</p>\n<p>點解「政府資助」既節目，往往反而冇市場關注？原因可能係創作自由度受限、KPI壓力只關注完成項目而非收視、平台配套不足。公帑同市場，佢地既邏輯本身就唔同。用公帑既節目，往往注重「文化價值」多於「商業價值」。但咁樣既結果，就可能係——節目「有心做」，但「冇人睇」。</p>\n<p>《歲月如歌》既問題，唔係「做得差」，而係——佢生唔逢時。一個有政府資助、有戲曲中心靚場地、有歌唱嘉賓既節目，最後變成「冇人討論」，呢個本身就已經說明咗好多嘢。</p>\n<p>如果HOY TV想建立存在感，佢地需要既唔係再做多幾個《歲月如歌》，而係諗清楚——點樣先可以引起觀眾既注意？呢個先係佢地既真正挑戰。</p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-03-19-歲月如歌.md"}, {"id": 29, "title": "《戀愛等高線》— 小品綜藝的尷尬與ViuTV的隱憂", "contentType": "tv", "contentTypeLabel": "電視劇", "content_type": "tv", "date": "2026-03-19", "created": "2026-03-19", "updated": "2026-10-22", "status": "published", "statusLabel": "已發布", "platforms": ["viutv"], "platformLabels": ["ViuTV"], "platform": "ViuTV", "artist": "", "tags": ["ViuTV, 綜藝, 戀愛真人騷, 劇評"], "preview": "近年戀愛真人騷氾濫，觀眾既口味越來越刁鑽——《戀愛等高線》就正正撞正咗呢個市場變化。作為小品式戀愛綜藝，佢既定位注定咗佢唔會有太大既火花，但問題係——連小品應有既「輕鬆有趣」都唔夠。 小品綜藝既生存之道，係「易入口」——唔洗花太多心力，唔洗...", "content": "<p>近年戀愛真人騷氾濫，觀眾既口味越來越刁鑽——《戀愛等高線》就正正撞正咗呢個市場變化。作為小品式戀愛綜藝，佢既定位注定咗佢唔會有太大既火花，但問題係——連小品應有既「輕鬆有趣」都唔夠。</p>\n<p>小品綜藝既生存之道，係「易入口」——唔洗花太多心力，唔洗追得好辛苦，但偏偏，《戀愛等高線》就係輸咗喺呢度。佢太過「安全」——每個环节都照住傳統戀愛真人騷既公式，冇驚喜，冇突破。有觀眾話：「睇完一集都唔知想表達咩。」呢句說話雖然有啲夸张，但係的确講中咗呢個節目既問題——佢乜都想講，但乜都講唔深。</p>\n<p>小品既價值唔係「冇內容」，而係「精而簡」。你可以用15分鐘講一個完整既情感故事，但《戀愛等高線》似乎唔係咁諗——佢想乜都啱啱好，結果乜都唔够。</p>\n<p>呢幾年，ViuTV既綜藝比上不足、比下有餘。早期既成功靠既係——真實感同話題性。啲節目敢於觸及社會議題，敢於表現真人既一面。但近排既綜藝，似乎越來越「離地」——《戥愛等高線》就係其中一個例子。</p>\n<p>有觀眾指出：「ViuTV既綜藝越來越似TVB。」呢句說話雖然刻薄，但係反映緊一個事實——ViuTV曾經既「另類」同「創新」，似乎慢慢流失。佢地唔係唔可以做戀愛綜藝，而係要做「有ViuTV特色」既戀愛綜藝。</p>\n<p>從《戀愛等高線》既表現，我哋可以睇到ViuTV既一個趨勢——佢地開始做多啲「安全」既內容。呢個決定唔難理解：本地市場細，做大製作既風險高，做小品起碼唔會大敗。但長遠而言，如果唔再敢於創新，ViuTV既品牌形象就會慢慢模糊。</p>\n<p>《戀愛等高線》並非爛節目，但佢絕對稱唔上「好」。小品綜藝既失敗，通常唔係因為做得差，而係因為——乜都唔够。如果ViuTV想重拾昔日綜藝既光輝，佢地需要既唔係再複製下一個《戀愛等高線》，而係記得——點解當初觀眾會留意ViuTV？</p>", "cover": "", "sourcePath": "", "sourceUrl": "https://github.com/chiuchiunet/tv-review-dashboard/blob/main/tv-reviews/2026-03-19-戀愛等高線.md"}];
        const SUMMARY = {"total": 30, "draft": 2, "review": 2, "scheduled": 0, "published": 26, "archived": 0, "pending": 2};

        /* Cover placeholder palette per content type. */
        const COVER_THEMES = {"tv": {"a": "#1E3A8A", "b": "#0B1220", "glyph": "📺"}, "kpop": {"a": "#6D28D9", "b": "#160B27", "glyph": "🎤"}};
        const COVER_THEME_DEFAULT = {"a": "#3F3F46", "b": "#18181B", "glyph": "📄"};

        /* True in the deployed build. The repository is private, so the public
           site must not offer "edit on GitHub" links (they would 404 for
           visitors) and must not expose local filesystem paths. */
        const IS_PUBLIC_BUILD = true;

        /* ------------------------------------------------------------------
         * ONE place for every status definition (label, badge class, KPI id).
         * `pending` is a derived bucket = review + scheduled (see PENDING_BUCKET).
         * ------------------------------------------------------------------ */
        const STATUS_CONFIG = {
            draft: { label: '草稿', cls: 'status-draft' },
            review: { label: '待發布', cls: 'status-pending' },
            scheduled: { label: '待發布', cls: 'status-pending' },
            published: { label: '已發布', cls: 'status-published' },
            archived: { label: '封存', cls: 'status-archived' }
        };

        // ONE place for the derived pending bucket mapping.
        const PENDING_BUCKET = ['review', 'scheduled'];

        const FILTER_DEFAULTS = {
            type: 'all',
            platform: [],
            status: 'all',
            sort: 'updated_desc',
            search: ''
        };

        const SORT_OPTIONS = ['updated_desc', 'created_desc', 'title_asc'];
        const TYPE_OPTIONS = ['all', 'tv', 'kpop'];
        const STATUS_OPTIONS = ['all', 'draft', 'pending', 'published', 'archived'];
        const THEME_KEY = 'creation-theme';

        /* ------------------------------------------------------------------
         * Single source of truth for all filter state.
         * platform is an ARRAY of canonical platform ids (multi-select).
         * ------------------------------------------------------------------ */
        const state = {
            type: FILTER_DEFAULTS.type,
            platform: FILTER_DEFAULTS.platform.slice(),
            status: FILTER_DEFAULTS.status,
            sort: FILTER_DEFAULTS.sort,
            search: FILTER_DEFAULTS.search
        };

        const $ = (id) => document.getElementById(id);

        function escapeHtml(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function statusConfig(status) {
            return STATUS_CONFIG[status] || STATUS_CONFIG.draft;
        }

        /* ================= URL state (spec 6) ================= */

        function parseUrlState() {
            const params = new URLSearchParams(window.location.search || '');
            const next = {
                type: FILTER_DEFAULTS.type,
                platform: [],
                status: FILTER_DEFAULTS.status,
                sort: FILTER_DEFAULTS.sort,
                search: ''
            };

            const type = params.get('type');
            if (TYPE_OPTIONS.indexOf(type) !== -1) next.type = type;

            const status = params.get('status');
            if (STATUS_OPTIONS.indexOf(status) !== -1) next.status = status;

            const sort = params.get('sort');
            if (SORT_OPTIONS.indexOf(sort) !== -1) next.sort = sort;

            // Comma-separated canonical ids. Ids that do not exist anywhere in
            // the data are dropped, so a junk `?platform=nope` falls back to the
            // default (no platform filter) instead of hiding every article.
            const rawPlatform = params.get('platform');
            if (rawPlatform) {
                const known = [];
                ARTICLES.forEach((article) => {
                    (article.platforms || []).forEach((pid) => {
                        if (known.indexOf(pid) === -1) known.push(pid);
                    });
                });
                const valid = [];
                rawPlatform.split(',').forEach((pid) => {
                    const id = pid.trim();
                    if (id && known.indexOf(id) !== -1 && valid.indexOf(id) === -1) valid.push(id);
                });
                next.platform = valid;
            }

            const q = params.get('q');
            if (q) next.search = q;

            return next;
        }

        function buildUrlQuery() {
            const params = new URLSearchParams();
            if (state.type !== FILTER_DEFAULTS.type) params.set('type', state.type);
            if (state.platform.length) params.set('platform', state.platform.join(','));
            if (state.status !== FILTER_DEFAULTS.status) params.set('status', state.status);
            if (state.sort !== FILTER_DEFAULTS.sort) params.set('sort', state.sort);
            if (state.search) params.set('q', state.search);
            const query = params.toString();
            return query ? '?' + query : '';
        }

        function applyState(next) {
            state.type = next.type;
            state.platform = next.platform.slice();
            state.status = next.status;
            state.sort = next.sort;
            state.search = next.search;
        }

        // Every filter change goes through here: update state, push URL, re-render.
        function commitState(next, options) {
            const opts = options || {};
            applyState(next);
            if (opts.syncUrl !== false) syncUrl();
            if (opts.syncControls !== false) syncControls();
            if (opts.render !== false) render();
        }

        // ALWAYS pushState (never replaceState) so back/forward walks the states.
        function syncUrl() {
            const url = window.location.pathname + buildUrlQuery() + window.location.hash;
            window.history.pushState({}, '', url);
        }

        /* ================= Filtering + sorting (spec 5) ================= */

        function matchesStatus(article, wanted) {
            if (wanted === 'all') return true;
            if (wanted === 'pending') return PENDING_BUCKET.indexOf(article.status) !== -1;
            return article.status === wanted;
        }

        // Multi-select: an article matches if it includes ANY selected platform.
        // Uses the platforms ARRAY, never string equality on the summary string.
        function matchesPlatform(article) {
            if (!state.platform.length) return true;
            const own = article.platforms || [];
            return state.platform.some((pid) => own.indexOf(pid) !== -1);
        }

        function matchesSearch(article) {
            const needle = state.search.trim().toLowerCase();
            if (!needle) return true;
            const haystack = [
                article.title,
                (article.platformLabels || []).join(' '),
                (article.tags || []).join(' '),
                article.artist || ''
            ].join(' ').toLowerCase();
            return haystack.indexOf(needle) !== -1;
        }

        function applyFilters() {
            return ARTICLES.filter((article) =>
                (state.type === 'all' || article.contentType === state.type)
                && matchesPlatform(article)
                && matchesStatus(article, state.status)
                && matchesSearch(article));
        }

        function localeZh() {
            try {
                return new Intl.Collator('zh-HK').compare ? 'zh-HK' : 'zh';
            } catch (err) {
                return 'zh';
            }
        }

        function sortArticles(list) {
            const sorted = list.slice();
            const cmp = localeZh();
            if (state.sort === 'title_asc') {
                sorted.sort((a, b) => String(a.title).localeCompare(String(b.title), cmp));
            } else if (state.sort === 'created_desc') {
                sorted.sort((a, b) => {
                    const byDate = String(b.date || '').localeCompare(String(a.date || ''));
                    if (byDate !== 0) return byDate;
                    return String(b.updated || '').localeCompare(String(a.updated || ''));
                });
            } else {
                sorted.sort((a, b) => {
                    const byUpdated = String(b.updated || '').localeCompare(String(a.updated || ''));
                    if (byUpdated !== 0) return byUpdated;
                    return String(b.date || '').localeCompare(String(a.date || ''));
                });
            }
            return sorted;
        }

        function activeFilterCount() {
            let count = 0;
            if (state.type !== FILTER_DEFAULTS.type) count++;
            if (state.platform.length) count++;
            if (state.status !== FILTER_DEFAULTS.status) count++;
            if (state.search) count++;
            return count;
        }

        /* ================= Rendering (spec 7 / 8) ================= */

        function renderCard(article) {
            const config = statusConfig(article.status);
            const hasSource = !!article.sourceUrl;
            const editHref = hasSource ? article.sourceUrl : '#';
            const editTitle = hasSource ? article.sourcePath : '（此檔案喺另一個 repo：' + article.sourcePath + '）';

            let cover;
            if (article.cover) {
                cover = '<img src="' + escapeHtml(article.cover) + '"'
                    + ' alt="《' + escapeHtml(article.title) + '》封面">';
            } else {
                const theme = COVER_THEMES[article.contentType] || COVER_THEME_DEFAULT;
                const word = (article.artist || article.contentTypeLabel || '');
                const sub = (article.platformLabels && article.platformLabels.length)
                    ? article.platformLabels.slice(0, 3).join(' · ')
                    : (article.date || '');
                cover = '<div class="cover-placeholder" aria-hidden="true"'
                    + ' style="--cover-a:' + theme.a + ';--cover-b:' + theme.b + '">'
                    + '<span class="cover-glyph">' + theme.glyph + '</span>'
                    + '<span class="cover-word">' + escapeHtml(word) + '</span>'
                    + '<span class="cover-sub">' + escapeHtml(sub) + '</span>'
                    + '</div>'
                    + '<span class="cover-type">'
                    + escapeHtml(article.contentTypeLabel) + '</span>';
            }

            let badges = '<span class="status-badge ' + config.cls + '">'
                + escapeHtml(config.label) + '</span>'
                + '<span class="content-type-badge">' + escapeHtml(article.contentTypeLabel) + '</span>';
            (article.platformLabels || []).forEach((label) => {
                badges += '<span class="platform-badge">' + escapeHtml(label) + '</span>';
            });
            if (article.artist) {
                badges += '<span class="artist-badge">🎤 ' + escapeHtml(article.artist) + '</span>';
            }

            // The repository is private, so the deployed build must not link
            // visitors to GitHub (it would 404 for anyone without access).
            const menuItems = '<button type="button" class="menu-item" role="menuitem" data-menu-action="copy">複製連結</button>'
                + (IS_PUBLIC_BUILD
                    ? ''
                    : (hasSource
                        ? '<a class="menu-item" role="menuitem" data-menu-action="github" href="'
                            + escapeHtml(article.sourceUrl) + '" target="_blank" rel="noopener noreferrer">開 GitHub 檔案</a>'
                        : '<button type="button" class="menu-item" role="menuitem" data-menu-action="copypath">複製源檔路徑</button>'));

            // The repository is private, so the deployed build omits the edit
            // affordances entirely instead of linking visitors to a 404.
            const editAction = IS_PUBLIC_BUILD
                ? ''
                : (hasSource
                    ? '<a class="btn btn-ghost" data-action="edit" href="' + escapeHtml(editHref) + '"'
                        + ' target="_blank" rel="noopener noreferrer"'
                        + ' title="' + escapeHtml(editTitle) + '">編輯</a>'
                    : '<button class="btn btn-ghost" data-action="copypath" type="button"'
                        + ' title="複製源檔路徑：' + escapeHtml(editTitle) + '">編輯</button>');

            return '<article class="article-card" data-id="' + article.id + '" tabindex="0" role="button"'
                + ' aria-label="打開文章：' + escapeHtml(article.title) + '">'
                + '<div class="card-cover">' + cover + '</div>'
                + '<div class="card-body">'
                + '<div class="card-badges">' + badges + '</div>'
                + '<h3 class="card-title">' + escapeHtml(article.title) + '</h3>'
                + '<p class="card-excerpt">' + escapeHtml(article.preview) + '</p>'
                + '<div class="card-meta">更新於 ' + escapeHtml(article.updated || article.date)
                + ' · 發布 ' + escapeHtml(article.date) + '</div>'
                + '<div class="card-actions">'
                + editAction
                + '<button class="btn btn-ghost" data-action="preview" type="button">預覽</button>'
                + '<button class="btn btn-ghost btn-more" data-action="more" type="button"'
                    + ' aria-label="更多操作" aria-haspopup="true" aria-expanded="false">更多</button>'
                + '<div class="menu" data-role="more-menu" hidden>'
                + menuItems
                + '</div>'
                + '</div>'
                + '</div>'
                + '</article>';
        }

        function renderSkeleton() {
            $('skeletonGrid').hidden = false;
            $('skeletonGrid').removeAttribute('aria-hidden');
            $('articleList').hidden = true;
            $('emptyState').hidden = true;
            $('errorState').hidden = true;
        }

        function renderEmpty() {
            $('skeletonGrid').hidden = true;
            $('articleList').hidden = true;
            $('errorState').hidden = true;
            $('emptyState').hidden = false;
        }

        function renderError() {
            $('skeletonGrid').hidden = true;
            $('articleList').hidden = true;
            $('emptyState').hidden = true;
            $('errorState').hidden = false;
        }

        function renderList(list) {
            $('skeletonGrid').hidden = true;
            $('errorState').hidden = true;
            $('emptyState').hidden = true;
            $('articleList').hidden = list.length === 0;
            $('articleList').innerHTML = list.map(renderCard).join('');
        }

        function render() {
            let list = [];
            try {
                list = sortArticles(applyFilters());
                if (!list.length) {
                    renderEmpty();
                } else {
                    renderList(list);
                }
                $('resultCount').textContent = '顯示 ' + list.length + ' / ' + ARTICLES.length + ' 篇文章';
            } catch (err) {
                renderError();
                $('resultCount').textContent = '載入文章時出錯';
                if (window.console && console.error) console.error(err);
            }
        }

        function initialRender() {
            renderSkeleton();
            window.setTimeout(() => {
                commitState(parseUrlState(), { syncUrl: false });
            }, 300);
        }

        /* ================= Control sync ================= */

        function chipIsActive(chip) {
            const group = chip.dataset.group;
            const value = chip.dataset.value;
            // platform is multi-select; the single 「全部」 chip stands for "none selected"
            if (group === 'platform') {
                if (value === 'all') return state.platform.length === 0;
                return state.platform.indexOf(value) !== -1;
            }
            return state[group] === value;
        }

        // One delegated handler covers desktop chips AND drawer chips because
        // both carry data-group / data-value.
        function syncControls() {
            document.querySelectorAll('.chip[data-group]').forEach((chip) => {
                const isActive = chipIsActive(chip);
                chip.classList.toggle('active', isActive);
                chip.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });

            document.querySelectorAll('.kpi-card').forEach((card) => {
                const isActive = card.dataset.status === state.status;
                card.classList.toggle('active', isActive);
                card.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });

            const input = $('searchInput');
            if (document.activeElement !== input && input.value !== state.search) {
                input.value = state.search;
            }

            const count = activeFilterCount();
            $('filterToggle').textContent = count ? '篩選 · ' + count : '篩選';
        }

        /* ================= Filter mutations ================= */

        function setFilter(group, value) {
            const next = {
                type: state.type,
                platform: state.platform.slice(),
                status: state.status,
                sort: state.sort,
                search: state.search
            };

            if (group === 'platform') {
                if (value === 'all') {
                    next.platform = [];
                } else {
                    const at = next.platform.indexOf(value);
                    if (at === -1) next.platform.push(value);
                    else next.platform.splice(at, 1);
                }
            } else if (Object.prototype.hasOwnProperty.call(next, group)) {
                next[group] = value;
            }

            commitState(next);
        }

        function clearFilters() {
            // Reset state + clear URL query entirely, but still pushState so
            // back/forward keeps working.
            commitState({
                type: FILTER_DEFAULTS.type,
                platform: [],
                status: FILTER_DEFAULTS.status,
                sort: FILTER_DEFAULTS.sort,
                search: FILTER_DEFAULTS.search
            });
        }

        /* ================= Clipboard helpers ================= */

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => copyTextFallback(text));
                return;
            }
            copyTextFallback(text);
        }

        function copyTextFallback(text) {
            const area = document.createElement('textarea');
            area.value = text;
            area.setAttribute('readonly', '');
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            try { document.execCommand('copy'); } catch (err) { /* no-op */ }
            document.body.removeChild(area);
        }

        function articlePermalink(article) {
            return window.location.origin + window.location.pathname
                + buildUrlQuery() + '#article-' + article.id;
        }

        /* ================= Article modal (spec 10) ================= */

        let articleModalTrigger = null;

        function findArticle(id) {
            const key = String(id);
            return ARTICLES.find((article) => String(article.id) === key);
        }

        function openArticleModal(id, trigger) {
            const article = findArticle(id);
            if (!article) return;
            const config = statusConfig(article.status);

            let badges = '<span class="status-badge ' + config.cls + '">'
                + escapeHtml(config.label) + '</span>'
                + '<span class="content-type-badge">' + escapeHtml(article.contentTypeLabel) + '</span>';
            (article.platformLabels || []).forEach((label) => {
                badges += '<span class="platform-badge">' + escapeHtml(label) + '</span>';
            });
            if (article.artist) {
                badges += '<span class="artist-badge">🎤 ' + escapeHtml(article.artist) + '</span>';
            }

            $('modalBadges').innerHTML = badges;
            $('modalTitle').textContent = article.title;
            $('modalMeta').textContent = '更新於 ' + (article.updated || article.date)
                + ' · 發布 ' + article.date;
            // article.content is sanitised server-side article HTML: insert as HTML.
            $('modalContent').innerHTML = article.content;

            articleModalTrigger = trigger || document.activeElement;
            const modal = $('articleModal');
            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            $('articleModalClose').focus();
        }

        function closeArticleModal() {
            const modal = $('articleModal');
            if (!modal.classList.contains('active')) return;
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            if (articleModalTrigger && document.contains(articleModalTrigger)) {
                articleModalTrigger.focus();
            }
            articleModalTrigger = null;
        }

        function isArticleModalOpen() {
            return $('articleModal').classList.contains('active');
        }

        /* ================= 更多 menu ================= */

        let openMoreMenuEl = null;
        let moreMenuTrigger = null;

        function closeMoreMenu(refocus) {
            if (!openMoreMenuEl) return;
            openMoreMenuEl.hidden = true;
            const btn = openMoreMenuEl.querySelector('[data-action="more"]');
            if (btn) btn.setAttribute('aria-expanded', 'false');
            if (refocus && moreMenuTrigger && document.contains(moreMenuTrigger)) {
                moreMenuTrigger.focus();
            }
            openMoreMenuEl = null;
            moreMenuTrigger = null;
        }

        function openMoreMenu(articleId, trigger) {
            closeMoreMenu(false);
            const card = document.querySelector('.article-card[data-id="' + articleId + '"]');
            if (!card) return;
            const menu = card.querySelector('[data-role="more-menu"]');
            if (!menu) return;
            menu.hidden = false;
            trigger.setAttribute('aria-expanded', 'true');
            openMoreMenuEl = menu;
            moreMenuTrigger = trigger;
            const first = menu.querySelector('.menu-item');
            if (first) first.focus();
        }

        function toggleMoreMenu(articleId, trigger) {
            if (openMoreMenuEl && openMoreMenuEl.closest('.article-card[data-id="' + articleId + '"]')) {
                closeMoreMenu(true);
            } else {
                openMoreMenu(articleId, trigger);
            }
        }

        function isMoreMenuOpen() {
            return !!openMoreMenuEl;
        }

        /* ================= Filter drawer (spec 9) ================= */

        function toggleDrawer(open) {
            const drawer = $('filterDrawer');
            const shouldOpen = typeof open === 'boolean' ? open : drawer.hidden;
            drawer.hidden = !shouldOpen;
            $('filterToggle').setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
            if (shouldOpen) {
                $('drawerCloseBtn').focus();
            } else {
                $('filterToggle').focus();
            }
        }

        function isDrawerOpen() {
            return !$('filterDrawer').hidden;
        }

        /* ================= Theme (spec 3) ================= */

        function applyTheme(theme) {
            const dark = theme === 'dark';
            document.body.setAttribute('data-theme', dark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            const btn = $('themeBtn');
            btn.textContent = dark ? '☀️' : '🌙';
            btn.setAttribute('aria-label', dark ? '切換淺色模式' : '切換深色模式');
            btn.setAttribute('title', dark ? '切換淺色模式' : '切換深色模式');
            btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        }

        function loadTheme() {
            let stored = null;
            try { stored = window.localStorage.getItem(THEME_KEY); } catch (err) { stored = null; }
            applyTheme(stored === 'dark' || stored === 'light' ? stored : 'light');
        }

        function toggleTheme() {
            const dark = document.body.getAttribute('data-theme') === 'dark';
            const next = dark ? 'light' : 'dark';
            applyTheme(next);
            try { window.localStorage.setItem(THEME_KEY, next); } catch (err) { /* no-op */ }
        }

        /* ================= 新增文章 modal ================= */

        const WORKFLOWS = {
            tv: {
                title: '新增 TV 評論',
                dir: 'tv-reviews/',
                note: '檔案放喺呢個 repo 嘅 tv-reviews/ 資料夾。',
                body: function () {
                    return '<p>' + this.note + ' 喺 <code>' + this.dir + '</code> 新增一個 .md 檔，'
                        + '以下面嘅 frontmatter 開頭，之後重新執行 generator。</p>'
                        + '<pre class="frontmatter-template"><code>---\n'
                        + 'title: 劇集標題 — 標題\n'
                        + 'platform: TVB\n'
                        + 'status: draft\n'
                        + 'date: 2026-01-01\n'
                        + 'tags: [tag1, tag2]\n'
                        + '---\n\n## 文章\n\n正文…\n</code></pre>'
                        + '<pre class="frontmatter-template"><code>python3 scripts/generate_dashboard.py</code></pre>';
                }
            },
            kpop: {
                title: '新增 K-Pop 內容',
                dir: 'posts/',
                note: 'K-Pop 內容放喺另一個內容庫，唔喺呢個 repo 入面。',
                body: function () {
                    return '<p>' + this.note + ' 喺另一個內容庫嘅 <code>' + this.dir
                        + '</code> 新增一個 .md 檔，然後重新執行 generator。</p>'
                        + '<pre class="frontmatter-template"><code>---\n'
                        + 'title: 藝人 — 專輯\n'
                        + 'platform: Spotify|YouTube\n'
                        + 'status: draft\n'
                        + 'artist: 藝人名\n'
                        + 'date: 2026-01-01\n'
                        + 'tags: [tag1, tag2]\n'
                        + '---\n\n## 文章\n\n正文…\n</code></pre>'
                        + '<pre class="frontmatter-template"><code>python3 scripts/generate_dashboard.py</code></pre>';
                }
            }
        };

        let addModalTrigger = null;

        function openAddModal(kind, trigger) {
            const workflow = WORKFLOWS[kind] || WORKFLOWS.tv;
            $('addModalTitle').textContent = workflow.title;
            $('addModalBody').innerHTML = workflow.body();
            closeAddMenu();
            addModalTrigger = trigger || document.activeElement;
            const modal = $('addModal');
            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            $('addModalClose').focus();
        }

        function closeAddModal() {
            const modal = $('addModal');
            if (!modal.classList.contains('active')) return;
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            if (addModalTrigger && document.contains(addModalTrigger)) {
                addModalTrigger.focus();
            }
            addModalTrigger = null;
        }

        function isAddModalOpen() {
            return $('addModal').classList.contains('active');
        }

        function closeAddMenu() {
            $('addMenu').hidden = true;
            $('addArticleBtn').setAttribute('aria-expanded', 'false');
        }

        function toggleAddMenu() {
            const menu = $('addMenu');
            menu.hidden = !menu.hidden;
            $('addArticleBtn').setAttribute('aria-expanded', menu.hidden ? 'false' : 'true');
        }

        /* ================= Event wiring ================= */

        function bindEvents() {
            // Delegated: covers filter bar chips AND drawer chips.
            document.addEventListener('click', (event) => {
                const chip = event.target.closest('.chip[data-group]');
                if (chip) {
                    setFilter(chip.dataset.group, chip.dataset.value);
                    return;
                }

                const kpi = event.target.closest('.kpi-card');
                if (kpi) {
                    const next = {
                        type: state.type,
                        platform: state.platform.slice(),
                        status: kpi.dataset.status,
                        sort: state.sort,
                        search: state.search
                    };
                    commitState(next);
                    return;
                }

                const workflow = event.target.closest('.menu-item[data-workflow]');
                if (workflow) {
                    openAddModal(workflow.dataset.workflow, event.target.closest('#addArticleBtn'));
                    return;
                }

                // 更多 menu items
                const menuAction = event.target.closest('.menu-item[data-menu-action]');
                if (menuAction) {
                    event.stopPropagation();
                    const card = menuAction.closest('.article-card');
                    const article = card ? findArticle(card.dataset.id) : null;
                    if (article) {
                        if (menuAction.dataset.menuAction === 'copy') {
                            copyText(articlePermalink(article));
                        } else if (menuAction.dataset.menuAction === 'copypath') {
                            copyText(article.sourcePath);
                        }
                    }
                    closeMoreMenu(true);
                    return;
                }

                // Card action buttons stopPropagation so the card does NOT open.
                const action = event.target.closest('.card-actions [data-action]');
                if (action) {
                    event.stopPropagation();
                    const card = action.closest('.article-card');
                    if (!card) return;
                    const kind = action.dataset.action;
                    if (kind === 'more') {
                        toggleMoreMenu(card.dataset.id, action);
                    } else if (kind === 'preview') {
                        openArticleModal(card.dataset.id, action);
                    } else if (kind === 'copypath') {
                        const art = findArticle(card.dataset.id);
                        if (art && art.sourcePath) {
                            copyText(art.sourcePath);
                        }
                    } else if (kind === 'edit' && !articleHasSource(card)) {
                        event.preventDefault();
                    }
                    return;
                }

                // Whole card opens the detail modal.
                const card = event.target.closest('.article-card');
                if (card) {
                    openArticleModal(card.dataset.id, card);
                    return;
                }

                // Clicking outside closes menus / drawer-ish popovers.
                if (!event.target.closest('.card-actions')) {
                    closeMoreMenu(false);
                }
            });

            $('searchInput').addEventListener('input', (event) => {
                const next = {
                    type: state.type,
                    platform: state.platform.slice(),
                    status: state.status,
                    sort: state.sort,
                    search: event.target.value
                };
                commitState(next);
            });

            $('clearFilters').addEventListener('click', clearFilters);
            $('emptyClearBtn').addEventListener('click', clearFilters);
            $('retryBtn').addEventListener('click', () => {
                commitState(parseUrlState(), { syncUrl: false });
            });
            $('themeBtn').addEventListener('click', toggleTheme);
            $('addArticleBtn').addEventListener('click', toggleAddMenu);
            $('addModalClose').addEventListener('click', closeAddModal);
            $('articleModalClose').addEventListener('click', closeArticleModal);
            $('filterToggle').addEventListener('click', () => toggleDrawer());
            $('drawerCloseBtn').addEventListener('click', () => toggleDrawer(false));

            [$('articleModal'), $('addModal')].forEach((modal) => {
                modal.addEventListener('click', (event) => {
                    if (event.target === modal) {
                        if (modal.id === 'articleModal') closeArticleModal();
                        else closeAddModal();
                    }
                });
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    // Esc closes the top-most thing first.
                    if (isMoreMenuOpen()) {
                        closeMoreMenu(true);
                    } else if (isDrawerOpen()) {
                        toggleDrawer(false);
                    } else if (isArticleModalOpen()) {
                        closeArticleModal();
                    } else if (isAddModalOpen()) {
                        closeAddModal();
                    } else {
                        closeAddMenu();
                    }
                    return;
                }

                if (event.target.classList && event.target.classList.contains('article-card')) {
                    if (event.key === 'Enter' || event.key === ' ' || event.key === 'Spacebar') {
                        event.preventDefault();
                        openArticleModal(event.target.dataset.id, event.target);
                    }
                }
            });

            // MANDATORY: back/forward restores filter state.
            window.addEventListener('popstate', () => {
                commitState(parseUrlState(), { syncUrl: false });
            });
        }

        function articleHasSource(card) {
            const article = findArticle(card.dataset.id);
            return !!(article && article.sourceUrl);
        }

        /* ================= Boot ================= */

        function init() {
            loadTheme();
            bindEvents();
            initialRender();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
